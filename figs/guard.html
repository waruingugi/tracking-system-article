/* The design tokens. Paste this :root block at the top of every page's <style>.
   Light is the default. Every page also ships the night theme: the two blocks at the end.
   Fonts: one Google Fonts link (see components/README.md). */
:root {
  /* paper and ink */
  --paper: #eff2f1;        /* page background */
  --paper-raised: #f8faf9; /* cards and panels */
  --paper-sunk: #e5e9e8;   /* wells, hover fills, the columns note pane */
  --canvas: #f1f3f2;       /* behind dot-grid diagrams */
  --ink: #15181b;
  --ink-rgb: 21 24 27;
  --ink-soft: #363c41;
  --muted: #5b6368;
  --dim: #8e969a;
  --line: rgba(20, 23, 26, .12);
  --line-hi: rgba(20, 23, 26, .26);

  /* the one accent */
  --accent: #e14a0e;       /* big text, marks, the one focal thing */
  --accent-text: #b33a0a;  /* small orange text: links, eyebrow numbers, labels */
  --accent-rgb: 225 74 14;
  --accent-soft: rgba(225, 74, 14, .08);

  /* what each colour means, the same everywhere */
  --sys-frontend: #0891b2;
  --sys-backend: #047857;
  --sys-database: #6d28d9;
  --sys-security: #be123c;
  --sys-bus: #b45309;
  --sys-external: #475569;

  /* the dark plate: code, terminals and the end card only */
  --plate: #0f1216;
  --plate-raised: #161a1f;
  --plate-line: rgba(255, 255, 255, .12);
  --plate-text: #dfe5ea;
  --plate-dim: #79848d;
  --syn-k: #ff9b6b; --syn-s: #a8dcb6; --syn-f: #f2d58c; --syn-t: #8fc8ff;
  --syn-n: #e9b0ff; --syn-c: #6c7882; --syn-p: #c9d3db;
  --diff-add: #3fb950; --diff-del: #f85149; --diff-mod: #d29922; --diff-ren: #58a6ff;

  /* type */
  --font-display: 'Fraunces', Georgia, serif;
  --font-grot: 'Space Grotesk', 'Inter', -apple-system, sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --font-num: 'Antonio', 'Arial Narrow', sans-serif;

  /* shape and motion */
  --radius: 14px;
  --shadow-sm: 0 1px 0 rgba(20, 23, 26, .03), 0 1px 3px rgba(20, 23, 26, .06);
  --shadow-lg: 0 1px 0 rgba(20, 23, 26, .03), 0 30px 60px -30px rgba(20, 23, 26, .28);
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --ease-in-out: cubic-bezier(.65, 0, .35, 1);

  /* Hairline figures take their colours from the page */
  --hairline-plate: var(--paper-raised);
  --hairline-hi: var(--accent);
  --hairline-edge: var(--ink);
  --hairline-mid: var(--muted);
  --hairline-lo: rgba(21, 24, 27, .2);
  --hairline-stroke: .9;

  color-scheme: light;
}
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 17px/1.65 var(--font-body); -webkit-font-smoothing: antialiased; }
::selection { background: rgb(var(--accent-rgb) / .2); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

/* Night theme. Every page ships it. Same jobs, darker paper, brighter orange.
   Two blocks with the same values, kept in step:
   1. the reader's system is dark and they have not picked light;
   2. the reader picked dark (data-theme="dark"), whatever the system says. */
@media (prefers-color-scheme: dark) {
  html:not([data-theme="light"]) {
    --paper: #0d1013;
    --paper-raised: #14181c;
    --paper-sunk: #090b0d;
    --canvas: #101317;
    --ink: #ebeff1;
    --ink-rgb: 235 239 241;
    --ink-soft: #c3cbd1;
    --muted: #8f999f;
    --dim: #5f686e;
    --line: rgb(255 255 255 / .09);
    --line-hi: rgb(255 255 255 / .2);
    --shadow-sm: 0 1px 0 rgb(255 255 255 / .03) inset, 0 1px 3px rgb(0 0 0 / .4);
    --shadow-lg: 0 1px 0 rgb(255 255 255 / .04) inset, 0 30px 60px -30px rgb(0 0 0 / .8);
    --accent: #ff6a2b;
    --accent-text: #ff8d5e;
    --accent-rgb: 255 106 43;
    --plate: #07090b;
    --plate-raised: #0e1114;
    --sys-frontend: #22b8d8;
    --sys-backend: #2bb98a;
    --sys-database: #9f7aea;
    --sys-security: #f0577a;
    --sys-bus: #e8923a;
    --sys-external: #8a98ab;
    --hairline-lo: rgba(235, 239, 241, .2);
    color-scheme: dark;
  }
}

}

/* ---- plain figures: a drawing, a read-out row, a caption line ---- */
html, body { margin: 0; background: var(--paper); }
body { font: 400 15px/1.5 var(--font-body); color: var(--ink); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
.pf { display: flex; flex-direction: column; }
.pf-stage { position: relative; }
.pf-stage svg { display: block; width: 100%; height: auto; overflow: visible; }
.pf-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 14px; padding: 12px 18px 16px; }
.pf-ro { display: flex; flex-wrap: wrap; gap: 8px; }
.pf-st { min-width: 0; padding: 7px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper-raised); }
.pf-st p { margin: 0; font: 500 10px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pf-st b { display: block; margin-top: 3px; font: 400 21px/1.1 var(--font-num); font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
.pf-st.hot b { color: var(--accent); }
.pf-say { flex: 1 1 260px; margin: 0; min-height: 2.9em; font-size: 14px; line-height: 1.45; color: var(--ink-soft); transition: opacity .16s var(--ease-out); }
.pf-say.out { opacity: 0; }
.pf-btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--line-hi); border-radius: 9px; background: var(--paper-raised); font: 500 13px/1 var(--font-body); color: var(--ink); cursor: pointer; transition: transform .15s var(--ease-out), background-color .15s; }
.pf-btn:hover { background: var(--paper-sunk); }
.pf-btn:active { transform: scale(.97); }
.pf-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pf-btn svg { width: 14px; height: 14px; }
/* Replay buttons are orange, so people see they can press them. */
.pf-btn[id$="Replay"], .pf-btn[id$="Re"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--paper-raised)); color: var(--accent-text); }
.pf-btn[id$="Replay"]:hover, .pf-btn[id$="Re"]:hover { background: color-mix(in srgb, var(--accent) 22%, var(--paper-raised)); }
@media (pointer: coarse) { .pf-btn { height: 40px; } }
/* svg text */
.t-lab { font: 500 13px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; fill: var(--ink); }
.t-sub { font: 400 14px/1 var(--font-body); fill: var(--muted); }
.t-hot { fill: var(--accent-text); }

.s-line { fill: none; stroke: var(--line-hi); stroke-width: 1.5; }

.s-card { fill: var(--paper-raised); stroke: var(--line-hi); stroke-width: 1.2; }
.s-ink { fill: var(--ink); }
.s-acc { fill: var(--accent); }

/* four phones, one cheating: two panels side by side */
.gd { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; }
.gd-p + .gd-p { border-left: 1px solid var(--line); }

.gd .pf-stage { padding: 6px 14px 0; }
.gd .pf-bar { flex: 1; align-items: flex-end; }
.gd .pf-say { flex-basis: 100%; min-height: 4.4em; }
.gd .t-lab { font-size: 12px; }
.gd .t-sub { font-size: 13px; }
@media (max-width: 599px) {
  .gd { grid-template-columns: minmax(0, 1fr); }
  .gd-p + .gd-p { border-left: 0; border-top: 1px solid var(--line); }
  .gd .pf-say { min-height: 0; }
}

<body class="kit">
<!--meta aspect 1030/500 -->
<!--meta title Four phones, one cheating -->
<div class="gd">
  <div class="pf gd-p">
    <p class="gd-eb">Cut off <b>one phone</b></p>
    <div class="pf-stage"><svg id="gdA" viewBox="0 0 440 330" role="img" aria-label="Four phones each send pings down their own line to a server. You revoke one phone, Sipho's. The server cuts its line: its pings stop and go grey. Every time it tries to reconnect, the server refuses it. The other three phones keep sending."></svg></div>
    <div class="pf-bar">
      <p class="pf-say" id="gdASay" aria-live="polite">Four phones send pings to the server, each down its own line.</p>
      <div class="pf-ro">
        <div class="pf-st"><p>Lines open</p><b id="gdAOpen">4</b></div>
        <div class="pf-st hot"><p>Reconnects refused</p><b id="gdARef">0</b></div>
        <button class="pf-btn" type="button" id="gdARe"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 8a5.5 5.5 0 1 0 1.7-4"/><path d="M2.5 2.5v3h3"/></svg>Replay</button>
      </div>
    </div>
  </div>
  <div class="pf gd-p">
    <p class="gd-eb">The <b>wrong channel</b> is refused</p>
    <div class="pf-stage"><svg id="gdB" viewBox="0 0 440 330" role="img" aria-label="Two phones, Amina's and Sipho's, each with its own channel on the server. Sipho's phone tries to send a ping into Amina's channel, pretending to be her. The server refuses it every time, while both phones' own pings go through."></svg></div>
    <div class="pf-bar">
      <p class="pf-say" id="gdBSay" aria-live="polite">Each phone may only send to its own channel.</p>
      <div class="pf-ro">
        <div class="pf-st"><p>Wrong channel, let in</p><b id="gdBIn">0</b></div>
        <div class="pf-st hot"><p>Refused</p><b id="gdBRef">0</b></div>
        <button class="pf-btn" type="button" id="gdBRe"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 8a5.5 5.5 0 1 0 1.7-4"/><path d="M2.5 2.5v3h3"/></svg>Replay</button>
      </div>
    </div>
  </div>
</div>

<script>
/* Shared helpers for the plain figures. */
(function () {
  'use strict';
  var root = document.documentElement, NS = 'http://www.w3.org/2000/svg', P = {};
  P.motionOn = function () { return root.dataset.motion !== 'off'; };
  P.narrow = function () { return window.innerWidth < 600; };
  P.el = function (parent, tag, a, text) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); if (text != null) e.textContent = text; if (parent) parent.appendChild(e); return e; };
  P.ease = function (t) { return 1 - Math.pow(1 - t, 3); };
  P.easeIO = function (t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  P.clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  /* a clock that reads performance.now() itself: a rAF timestamp can sit on another timeline inside an iframe */
  P.clock = function (fn) {
    var on = true, t0 = performance.now();
    (function f() { if (!on) return; var t = (performance.now() - t0) / 1000; if (fn(t) !== false) requestAnimationFrame(f); else on = false; })();
    return { stop: function () { on = false; } };
  };
  /* Play again after a short pause, so people who missed the start see it. Waits while the figure is off screen. */
  P.again = function (el, play, ms) {
    var vis = true, pend = false, t = 0;
    if ('IntersectionObserver' in window) new IntersectionObserver(function (es) { vis = es[0].isIntersecting; if (vis && pend) { pend = false; play(); } }).observe(el);
    return {
      done: function () { clearTimeout(t); t = setTimeout(function () { if (!P.motionOn()) return; if (vis) play(); else pend = true; }, ms || 3000); },
      cancel: function () { clearTimeout(t); pend = false; }
    };
  };
  P.onView = function (el, fn) {
    if (!('IntersectionObserver' in window)) { fn(); return; }
    var io = new IntersectionObserver(function (es) { if (es[0].isIntersecting) { io.disconnect(); fn(); } }, { threshold: .35 }); io.observe(el);
  };
  P.say = function (node, text) {
    if (!node || node.textContent === text) return;
    if (!P.motionOn()) { node.textContent = text; return; }
    node.classList.add('out'); setTimeout(function () { node.textContent = text; node.classList.remove('out'); }, 170);
  };
  P.bump = function (node, v) {
    v = String(v); if (node.textContent === v) return; node.textContent = v;
    if (P.motionOn()) node.animate([{ transform: 'translateY(-3px)', opacity: .4 }, { transform: 'none', opacity: 1 }], { duration: 240, easing: 'cubic-bezier(.22,1,.36,1)' });
  };
  /* redraw on width class change */
  P.onLayout = function (fn) { var n = P.narrow(); addEventListener('resize', function () { if (P.narrow() !== n) { n = P.narrow(); fn(); } }); };
  window.PF = P;
})();

<script>
/* Four phones, one cheating. Left: revoke one phone and its line goes dead, reconnects refused.
   Right: a phone tries to post into another phone's channel and the server refuses it. */
(function () {
  'use strict';
  var el = PF.el, X0 = 84, XS = 300, SW = 120, LIFE = 1.3;

  function phone(g, x, y) {
    var p = el(g, 'g', { transform: 'translate(' + x + ',' + y + ')' });
    el(p, 'rect', { x: -15, y: -25, width: 30, height: 50, rx: 7, fill: '#0f1216', stroke: 'var(--line-hi)' });
    var scr = el(p, 'rect', { x: -12, y: -21, width: 24, height: 42, rx: 4, fill: '#ffffff' });
    el(p, 'rect', { x: -4, y: -19, width: 8, height: 2, rx: 1, fill: '#8e969a' });
    el(p, 'rect', { x: -5, y: 17, width: 10, height: 1.6, rx: .8, fill: '#8e969a' });
    var dot = el(p, 'circle', { cx: 0, cy: 0, r: 4, class: 's-acc' });
    return { scr: scr, dot: dot };
  }
  /* a server: a rack with one bay per channel, each bay with a light and a name */
  function server(g, ys, names, top, bot) {
    el(g, 'text', { class: 't-lab', x: XS + SW / 2, y: top - 10, 'text-anchor': 'middle' }, 'Server');
    el(g, 'rect', { x: XS, y: top, width: SW, height: bot - top, rx: 10, class: 's-card' });
    for (var v = top + 14; v < bot - 8; v += 9) el(g, 'line', { x1: XS + SW - 16, y1: v, x2: XS + SW - 8, y2: v, class: 's-line', 'stroke-width': 1 });
    return ys.map(function (y, i) {
      var bay = el(g, 'rect', { x: XS + 8, y: y - 17, width: SW - 30, height: 34, rx: 6, fill: 'var(--paper-sunk)', stroke: 'var(--line)' });
      var led = el(g, 'circle', { cx: XS + 20, cy: y, r: 4.5, fill: '#2f9e64' });
      var t = el(g, 'text', { class: 't-lab', x: XS + 32, y: y + 4.5, style: 'font-size:11px' }, names[i]);
      return { bay: bay, led: led, t: t, name: names[i] };
    });
  }
  function cross(g, x, y, a) {
    var c = el(g, 'g', { transform: 'translate(' + x + ',' + y + ')', opacity: a });
    el(c, 'circle', { r: 10, class: 's-acc' });
    el(c, 'path', { d: 'M-4 -4 L4 4 M4 -4 L-4 4', stroke: '#fff', 'stroke-width': 2.2, 'stroke-linecap': 'round' });
  }

  /* ---------- left: cut off one phone ---------- */
  var A = { svg: document.getElementById('gdA'), say: document.getElementById('gdASay'), open: document.getElementById('gdAOpen'), ref: document.getElementById('gdARef') };
  var AY = [60, 140, 220, 300], AN = ['Thabo', 'Amina', 'Sipho', 'Lerato'], BAD = 2, T_REV = 3.5, T_TRY = 5.2, GAP_TRY = 1.5, END_A = 12.5;
  var aP = {};
  function drawA() {
    var s = A.svg; while (s.firstChild) s.removeChild(s.firstChild);
    var g = el(s, 'g', {});
    aP.lanes = AY.map(function (y) { return el(g, 'line', { class: 's-dash', x1: X0 + 20, y1: y, x2: XS + 8, y2: y }); });
    aP.phones = AY.map(function (y, i) { el(g, 'text', { class: 't-sub', x: X0 - 22, y: y + 5, 'text-anchor': 'end' }, AN[i]); return phone(g, X0, y); });
    aP.bays = server(g, AY, ['live', 'live', 'live', 'live'], 22, 322);
    aP.fly = el(g, 'g', {});
  }
  function frameA(t) {
    var f = aP.fly; while (f.firstChild) f.removeChild(f.firstChild);
    var revoked = t >= T_REV, refused = 0;
    AY.forEach(function (y, i) {
      var dead = i === BAD && revoked;
      for (var e = i * .27; e <= t; e += 1) {
        var age = t - e, k = age / LIFE;
        if (i === BAD && e >= T_REV) break;
        if (i === BAD && revoked && e + LIFE > T_REV) {
          /* in flight when the line was cut: it stops where it was and goes stale */
          var kk = (T_REV - e) / LIFE, fade = PF.clamp(1 - (t - T_REV) / 2.2, 0, 1);
          if (fade > 0) el(f, 'circle', { cx: X0 + 20 + (XS - X0 - 12) * kk, cy: y, r: 4.5, fill: 'var(--dim)', opacity: fade });
          continue;
        }
        if (k >= 1) continue;
        el(f, 'circle', { cx: X0 + 20 + (XS - X0 - 12) * k, cy: y, r: 4.5, class: 's-acc', opacity: .9 });
      }
      aP.lanes[i].setAttribute('opacity', dead ? .35 : 1);
      var b = aP.bays[i];
      b.led.setAttribute('fill', dead ? 'var(--accent)' : '#2f9e64');
      b.t.textContent = dead ? 'revoked' : 'live';
      b.t.setAttribute('class', 't-lab' + (dead ? ' t-hot' : ''));
      b.bay.setAttribute('stroke', dead ? 'var(--accent)' : 'var(--line)');
      aP.phones[i].scr.setAttribute('fill', dead ? '#d9dedd' : '#ffffff');
      aP.phones[i].dot.setAttribute('class', dead ? '' : 's-acc'); aP.phones[i].dot.setAttribute('fill', dead ? '#8e969a' : '');
    });
    /* reconnect tries: a grey dot goes up the dead line and bounces off the server */
    for (var tr = T_TRY; tr <= t; tr += GAP_TRY) {
      var a = t - tr, y2 = AY[BAD];
      if (a < .8) el(f, 'circle', { cx: X0 + 20 + (XS - X0 - 12) * PF.easeIO(a / .8), cy: y2, r: 4.5, fill: 'var(--dim)' });
      else { refused++; if (a < 1.4) cross(f, XS + 2, y2, 1 - (a - .8) / .6); }
    }
    PF.bump(A.open, revoked ? 3 : 4); PF.bump(A.ref, refused);
    PF.say(A.say, t < T_REV ? 'Four phones send pings to the server, each down its own line.'
      : t < T_TRY ? "You revoke Sipho's phone. Within about a second the server cuts its line, and its last pings go stale."
      : 'It keeps trying to reconnect. Every try is refused. The other three never notice.');
  }

  /* ---------- right: the wrong channel ---------- */
  var B = { svg: document.getElementById('gdB'), say: document.getElementById('gdBSay'), inn: document.getElementById('gdBIn'), ref: document.getElementById('gdBRef') };
  var BY = [95, 245], BN = ['Amina', 'Sipho'], T_CHEAT = 3, GAP_CHEAT = 2.2, END_B = 11.5;
  var bP = {};
  function drawB() {
    var s = B.svg; while (s.firstChild) s.removeChild(s.firstChild);
    var g = el(s, 'g', {});
    BY.forEach(function (y) { el(g, 'line', { class: 's-dash', x1: X0 + 20, y1: y, x2: XS + 8, y2: y }); });
    bP.cheat = el(g, 'line', { x1: X0 + 18, y1: BY[1] - 8, x2: XS + 6, y2: BY[0] + 10, stroke: 'var(--accent)', 'stroke-width': 1.5, 'stroke-dasharray': '3 5', opacity: 0 });
    BY.forEach(function (y, i) { el(g, 'text', { class: 't-sub', x: X0 - 22, y: y + 5, 'text-anchor': 'end' }, BN[i]); phone(g, X0, y); });
    bP.bays = server(g, BY, ["Amina's", "Sipho's"], 40, 300);
    el(g, 'text', { class: 't-sub', x: XS + SW / 2, y: 318, 'text-anchor': 'middle', style: 'font-size:12px' }, 'one channel per phone');
    bP.fly = el(g, 'g', {});
  }
  function frameB(t) {
    var f = bP.fly; while (f.firstChild) f.removeChild(f.firstChild);
    BY.forEach(function (y, i) {
      for (var e = i * .45; e <= t; e += 1.1) { var k = (t - e) / LIFE; if (k < 1) el(f, 'circle', { cx: X0 + 20 + (XS - X0 - 12) * k, cy: y, r: 4.5, class: 's-acc', opacity: .9 }); }
    });
    var refused = 0, flash = 0, x1 = X0 + 18, y1 = BY[1] - 8, x2 = XS + 6, y2 = BY[0] + 10;
    for (var c = T_CHEAT; c <= t; c += GAP_CHEAT) {
      var a = t - c;
      if (a < 1) { var k2 = PF.easeIO(a); el(f, 'circle', { cx: x1 + (x2 - x1) * k2, cy: y1 + (y2 - y1) * k2, r: 5, fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2.2 }); }
      else { refused++; if (a < 1.7) { var k3 = (a - 1) / .7; cross(f, x2, y2, 1 - k3); el(f, 'circle', { cx: x2 - 30 * k3, cy: y2 + 40 * k3 * k3, r: 5, fill: 'var(--dim)', opacity: 1 - k3 }); flash = 1 - k3; } }
    }
    bP.cheat.setAttribute('opacity', t >= T_CHEAT ? .8 : 0);
    var b = bP.bays[0];
    b.bay.setAttribute('stroke', flash > 0 ? 'var(--accent)' : 'var(--line)');
    PF.bump(B.inn, 0); PF.bump(B.ref, refused);
    PF.say(B.say, t < T_CHEAT ? 'Each phone may only send to its own channel. Both pings go through.'
      : refused === 0 ? "Sipho's phone tries to send a ping into Amina's channel, pretending to be her."
      : "The server refuses it, every time. A phone can only ever post its own position.");
  }

  function wire(draw, frame, end, svg, btn) {
    var run = null;
    function play() { lp.cancel(); if (run) run.stop(); run = PF.clock(function (t) { frame(Math.min(t, end)); if (t >= end) lp.done(); return t < end; }); }
    var lp = PF.again(svg, play);
    function still() { frame(end); }
    draw();
    document.getElementById(btn).addEventListener('click', function () { PF.motionOn() ? play() : still(); });
    PF.onLayout(function () { draw(); still(); });
    if (PF.motionOn()) { frame(0); PF.onView(svg, play); } else still();
  }
  wire(drawA, frameA, END_A, A.svg, 'gdARe');
  wire(drawB, frameB, END_B, B.svg, 'gdBRe');
})();

</script>
