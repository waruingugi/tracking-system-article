<style>
/* The design tokens. Paste this :root block at the top of every page's <style>.
   Light is the default. Every page also ships the night theme: the two blocks at the end.
   Fonts: one Google Fonts link (see components/README.md). */
:root {
  /* paper and ink */
  --paper: #eff2f1;        /* page background */
  --paper-raised: #f8faf9; /* cards and panels */
  --paper-sunk: #e5e9e8;   /* wells, hover fills, the columns note pane */
  --canvas: #f1f3f2;       /* behind dot-grid diagrams */
  --ink: #15181b;
  --ink-rgb: 21 24 27;
  --ink-soft: #363c41;
  --muted: #5b6368;
  --dim: #8e969a;
  --line: rgba(20, 23, 26, .12);
  --line-hi: rgba(20, 23, 26, .26);

  /* the one accent */
  --accent: #e14a0e;       /* big text, marks, the one focal thing */
  --accent-text: #b33a0a;  /* small orange text: links, eyebrow numbers, labels */
  --accent-rgb: 225 74 14;
  --accent-soft: rgba(225, 74, 14, .08);

  /* what each colour means, the same everywhere */
  --sys-frontend: #0891b2;
  --sys-backend: #047857;
  --sys-database: #6d28d9;
  --sys-security: #be123c;
  --sys-bus: #b45309;
  --sys-external: #475569;

  /* the dark plate: code, terminals and the end card only */
  --plate: #0f1216;
  --plate-raised: #161a1f;
  --plate-line: rgba(255, 255, 255, .12);
  --plate-text: #dfe5ea;
  --plate-dim: #79848d;
  --syn-k: #ff9b6b; --syn-s: #a8dcb6; --syn-f: #f2d58c; --syn-t: #8fc8ff;
  --syn-n: #e9b0ff; --syn-c: #6c7882; --syn-p: #c9d3db;
  --diff-add: #3fb950; --diff-del: #f85149; --diff-mod: #d29922; --diff-ren: #58a6ff;

  /* type */
  --font-display: 'Fraunces', Georgia, serif;
  --font-grot: 'Space Grotesk', 'Inter', -apple-system, sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --font-num: 'Antonio', 'Arial Narrow', sans-serif;

  /* shape and motion */
  --radius: 14px;
  --shadow-sm: 0 1px 0 rgba(20, 23, 26, .03), 0 1px 3px rgba(20, 23, 26, .06);
  --shadow-lg: 0 1px 0 rgba(20, 23, 26, .03), 0 30px 60px -30px rgba(20, 23, 26, .28);
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --ease-in-out: cubic-bezier(.65, 0, .35, 1);

  /* Hairline figures take their colours from the page */
  --hairline-plate: var(--paper-raised);
  --hairline-hi: var(--accent);
  --hairline-edge: var(--ink);
  --hairline-mid: var(--muted);
  --hairline-lo: rgba(21, 24, 27, .2);
  --hairline-stroke: .9;

  color-scheme: light;
}
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 17px/1.65 var(--font-body); -webkit-font-smoothing: antialiased; }
::selection { background: rgb(var(--accent-rgb) / .2); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

    --sp-soft: linear(0, 0.017, 0.059, 0.116, 0.181, 0.249, 0.317, 0.383, 0.446, 0.505, 0.559, 0.609, 0.653, 0.694, 0.73, 0.762, 0.791, 0.817, 0.839, 0.859, 0.877, 0.892, 0.905, 0.917, 0.928, 0.936, 0.944, 0.951, 0.958, 0.963, 0.968, 0.972, 0.975, 0.979, 0.981, 0.984, 0.986, 0.988, 0.989, 0.991, 0.992, 0.993, 0.994, 0.995, 0.995, 0.996, 0.996, 0.997, 1); --sp-soft-d: 0.67s;
  } }

/* part n71: its own rules from components/parts/base.css (made from the showcase). Paste after the starter's CSS. Don't edit; copy again. */
.kit #n71 .stage { container-type: inline-size; min-height: 230px; }
.kit #n71 .sg { width: min(100%, 420px); display: grid; gap: 14px; justify-items: start; text-align: left; }
.kit #n71 .tr { position: relative; isolation: isolate; display: inline-flex; max-width: 100%; gap: 2px; padding: 3px; border: 1px solid var(--line-hi); border-radius: 10px; background: var(--paper-raised); user-select: none; -webkit-user-select: none; }
.kit #n71 .pill { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.kit #n71 .pill rect { fill: var(--ink); }
.kit #n71 .sb { position: relative; display: inline-flex; align-items: center; height: 32px; padding: 0 13px; border: 0; border-radius: 7px; background: transparent; font: 500 13.5px/1 var(--font-body); color: var(--muted); white-space: nowrap; cursor: pointer; transition: color .16s var(--ease-out); }
.kit #n71 .sb > span { display: inline-block; transition: transform .15s var(--ease-out); }
.kit #n71 .sb:active > span { transform: scale(.97); }
/*@3009.0000 @media (hover: hover) and (pointer: fine)*/ .kit #n71 .tr > .sb:hover { color: var(--ink); }
.kit #n71 .sb:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.kit #n71 .ov { position: absolute; inset: 0; display: flex; gap: 2px; padding: 3px; pointer-events: none; }
.kit #n71 .ov .sb { color: var(--paper); }
.kit #n71 .vw { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kit #n71 .st { min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper-raised); }
.kit #n71 .st p { margin: 0; font: 500 10.5px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kit #n71 .st b { display: block; margin-top: 4px; font: 400 20px/1.18 var(--font-num); font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
.kit #n71 .cap { margin: 0; font-size: 13px; color: var(--ink-soft); }
/*@3018.0000 @container (max-width: 380px)*/ .kit #n71 .vw { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
/*@3018.0001 @container (max-width: 380px)*/ .kit #n71 .st:first-child { grid-column: 1 / -1; }
/*@3018.0002 @container (max-width: 380px)*/ .kit #n71 .sb { padding: 0 10px; font-size: 13px; }
/*@3019.0000 @media (pointer: coarse)*/ .kit #n71 .sb { height: 40px; }
.kit #n71 .rv { display: inline-flex; white-space: nowrap; }
.kit #n71 .dg, .kit #n71 .cm { display: inline-block; height: var(--h, 1.18em); line-height: var(--h, 1.18em); overflow: hidden; vertical-align: top; }
.kit #n71 .dg { -webkit-mask-image: linear-gradient(transparent, #000 7%, #000 93%, transparent); mask-image: linear-gradient(transparent, #000 7%, #000 93%, transparent); }
.kit #n71 .st7 { display: block; }
.kit #n71 .st7 span { display: block; height: var(--h, 1.18em); text-align: center; }
.kit #n71 .cm { white-space: pre; }

/* part n94: its own rules from components/parts/base.css (made from the showcase). Paste after the starter's CSS. Don't edit; copy again. */
.kit #n94 .fs { --tw: 6px; width: min(100%, 360px); display: grid; gap: 10px; text-align: left; }
.kit #n94 .fh { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.kit #n94 .fl { font-size: 13.5px; font-weight: 500; color: var(--ink); }
.kit #n94 .fv { display: flex; align-items: baseline; gap: .2em; font: 400 30px/1 var(--font-num); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.kit #n94 .cur { font: 500 .42em/1 var(--font-mono); letter-spacing: .04em; color: var(--muted); }
.kit #n94 .fg { margin: 0; font-size: 13.5px; color: var(--muted); }
.kit #n94 .fg b { font: 500 16px/1 var(--font-num); color: var(--ink); --h: 1.1em; }
.kit #n94 .dt { display: inline-grid; overflow: clip; vertical-align: bottom; }
.kit #n94 .dt > span { grid-area: 1 / 1; white-space: nowrap; }
.kit #n94 input { --p: .2041; width: 100%; height: 44px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }
.kit #n94 input:focus-visible { outline: none; }
.kit #n94 input::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--accent) calc(var(--tw) / 2 + var(--p) * (100% - var(--tw))), rgb(var(--ink-rgb) / .12) 0); }
.kit #n94 input::-moz-range-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--accent) calc(var(--tw) / 2 + var(--p) * (100% - var(--tw))), rgb(var(--ink-rgb) / .12) 0); }
.kit #n94 input::-webkit-slider-thumb { -webkit-appearance: none; width: 6px; height: 20px; margin-top: -8px; border: 0; border-radius: 3px; background: var(--accent); box-shadow: 0 0 0 2px var(--paper-raised); transition: transform var(--sp-bouncy-d) var(--sp-bouncy); }
.kit #n94 input::-moz-range-thumb { width: 6px; height: 20px; border: 0; border-radius: 3px; background: var(--accent); box-shadow: 0 0 0 2px var(--paper-raised); }
.kit #n94 input:active::-webkit-slider-thumb { transform: scaleY(1.2); }
.kit #n94 input:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 2px var(--paper-raised), 0 0 0 5px rgb(var(--accent-rgb) / .3); }
.kit #n94 input:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 2px var(--paper-raised), 0 0 0 5px rgb(var(--accent-rgb) / .3); }
.kit #n94 .mks { position: relative; height: 20px; margin-top: -14px; font: 500 10.5px/1 var(--font-mono); color: var(--muted); }
.kit #n94 .mks span { position: absolute; top: 0; padding-top: 8px; transform: translateX(-50%); transition: color .2s; }
.kit #n94 .mks span::before { content: ""; position: absolute; left: 50%; top: 0; width: 1px; height: 5px; background: var(--line-hi); transform-origin: top; transition: transform var(--sp-bouncy-d) var(--sp-bouncy), background-color .2s; }
.kit #n94 .mks span.lit { color: var(--accent-text); }
.kit #n94 .mks span.lit::before { background: var(--accent); }
.kit #n94 .mks span.bump::before { transform: scaleY(1.9); }
.kit #n94 .rv { display: inline-flex; white-space: nowrap; }
.kit #n94 .dg, .kit #n94 .cm { display: inline-block; height: var(--h, 1.18em); line-height: var(--h, 1.18em); overflow: hidden; vertical-align: top; }
.kit #n94 .dg { -webkit-mask-image: linear-gradient(transparent, #000 7%, #000 93%, transparent); mask-image: linear-gradient(transparent, #000 7%, #000 93%, transparent); }
.kit #n94 .st7 { display: block; }
.kit #n94 .st7 span { display: block; height: var(--h, 1.18em); text-align: center; }
.kit #n94 .cm { white-space: pre; }

/* ---- the map figures: one map, its controls, one readout card ---- */
html, body { margin: 0; background: var(--paper); }
body { font: 400 15px/1.5 var(--font-body); color: var(--ink); overflow-x: hidden; }
.kit .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.mf { position: relative; aspect-ratio: var(--ar, 16 / 10); overflow: hidden; background: var(--paper); }
.mf-map { position: absolute; inset: 0; }
.mf-map canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.mf-credit { position: absolute; right: 8px; bottom: 6px; z-index: 2; padding: 2px 7px; border-radius: 6px; background: rgb(239 242 241 / .82); font: 500 9.5px/1.4 var(--font-mono); letter-spacing: .02em; color: var(--muted); pointer-events: none; }
.mf-top { position: absolute; z-index: 3; left: 16px; top: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.mf-card { position: absolute; z-index: 3; left: 16px; bottom: 28px; width: 268px; padding: 12px 14px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper-raised); box-shadow: var(--shadow-sm); }
.mf-card.at-tr { left: auto; right: 16px; top: 16px; bottom: auto; }
.mf-card.at-br { left: auto; right: 16px; bottom: 28px; }
.mf-card.at-bl { left: 16px; bottom: 28px; }
.mf-card.at-tl { left: 16px; top: 72px; bottom: auto; }
.rc-eb { margin: 0 0 8px; font: 500 10.5px/1.3 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.rc-eb b { font-weight: 500; color: var(--accent-text); }
.rc-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.rc-list li { display: grid; grid-template-columns: 22px 10px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 9px; background: var(--paper); }
.rc-list li:first-child { background: rgb(var(--accent-rgb) / .07); }
.rc-list .pos { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line-hi); font: 500 13px/1 var(--font-num); color: var(--ink-soft); }
.rc-list li:first-child .pos { border-color: var(--accent); background: var(--accent); color: #fff; }
.rc-list .sw { width: 10px; height: 10px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 2px var(--paper-raised); }
.rc-list .sw.hot { background: var(--accent); }
.rc-list .nm { min-width: 0; font: 500 13.5px/1.2 var(--font-body); color: var(--ink); }
.rc-list .nm small { display: block; margin-top: 2px; font: 400 11.5px/1.2 var(--font-body); color: var(--muted); }
.rc-list .ds { font: 400 21px/1 var(--font-num); font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; display: inline-block; }
.rc-cap { margin: 9px 0 0; font-size: 12.5px; line-height: 1.45; color: var(--ink-soft); }
.rc-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.rc-stat { padding: 8px 10px; border-radius: 9px; background: var(--paper); }
.rc-stat p { margin: 0; font: 500 10px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.rc-stat b { display: block; margin-top: 4px; font: 400 24px/1.1 var(--font-num); font-variant-numeric: tabular-nums; color: var(--ink); }
.rc-stat.hot b { color: var(--accent); }
.mf-btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--line-hi); border-radius: 9px; background: var(--paper-raised); font: 500 13px/1 var(--font-body); color: var(--ink); cursor: pointer; transition: transform .15s var(--ease-out), background-color .15s; }
.mf-btn:hover { background: var(--paper-sunk); }
.mf-btn:active { transform: scale(.97); }
.mf-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mf-btn svg { width: 14px; height: 14px; }
/* the switch sits on the map, so it gets the small shadow cards get */
.kit #n71 .tr { box-shadow: var(--shadow-sm); }
@media (pointer: coarse) { .mf-btn { height: 40px; } }

/* phones: the switch on top, the map, then the card under it */
@media (max-width: 599px) {
  .mf { aspect-ratio: auto; overflow: visible; display: flex; flex-direction: column; }
  .mf-top { position: static; order: 0; padding: 12px 12px 10px; }
  .mf-map { position: relative; order: 1; aspect-ratio: var(--ar-n, 1 / 1); }
  .mf-card, .mf-card.at-tr, .mf-card.at-br, .mf-card.at-bl, .mf-card.at-tl { position: static; order: 2; width: auto; margin: 10px 12px 12px; }
}

/* a small feed of what the alert did */
.bs-feed { display: grid; margin-top: 8px; }
.bs-row { grid-area: 1 / 1; display: flex; align-items: flex-start; gap: 9px; padding: 9px 10px; border-radius: 9px; background: var(--paper); font-size: 12.5px; line-height: 1.4; color: var(--ink-soft); }
.bs-row b { display: block; font-weight: 600; color: var(--ink); }
.bs-row small { display: block; margin-top: 2px; font: 500 10.5px/1.3 var(--font-mono); letter-spacing: .04em; color: var(--muted); }
.bs-msg { background: rgb(var(--accent-rgb) / .07); }
.bs-ring { flex: none; width: 14px; height: 14px; margin-top: 1px; border-radius: 50%; border: 1.5px solid var(--dim); }
.bs-tick { flex: none; display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); }
.bs-tick svg { width: 14px; height: 14px; }
[hidden] { display: none !important; }

/* replay card */
@media (min-width: 600px) { .mf-card.rp-card { width: 300px; } }
.rp-card .rc-stats { margin-bottom: 6px; }
.rp-card .rp-status { font: 600 14.5px/1.3 var(--font-body); margin-top: 8px; color: var(--ink); }
.rp-card .rc-stat b { font-size: 22px; }
.rp-card #n94 .fs { width: 100%; gap: 4px; }
.rp-card #n94 .fv { font-size: 26px; }

/* two maps side by side (jitter) */
.jt { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; aspect-ratio: 16 / 8; }
.jt-p { position: relative; min-width: 0; overflow: hidden; border-radius: 12px; border: 1px solid var(--line); }
.jt-card { position: absolute; z-index: 3; left: 12px; top: 12px; width: 272px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper-raised); box-shadow: var(--shadow-sm); }
.jt-card .rc-stat b small { font: 500 10.5px/1 var(--font-mono); letter-spacing: .04em; color: var(--muted); margin-left: 6px; }
@media (max-width: 599px) {
  .jt { grid-template-columns: minmax(0, 1fr); aspect-ratio: auto; gap: 12px; }
  .jt-p { display: flex; flex-direction: column; }
  .jt-p .mf-map { position: relative; aspect-ratio: 1 / .78; order: 1; }
  .jt-card { position: static; order: 0; width: auto; margin: 0; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; box-shadow: none; }
}

/* pings card */
@media (min-width: 600px) { .mf-card.pg-card { width: 330px; } }
.pg-card .rc-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.pg-card .rc-stat b { font-variant-numeric: tabular-nums; }
.pg.jt { aspect-ratio: 16 / 8.4; }
.pg .jt-card { width: 250px; }
.pg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.pg-head .rc-eb { margin: 0; }
.pg-replay { height: 28px; padding: 0 10px; font-size: 12.5px; }
@media (max-width: 599px) { .pg.jt { aspect-ratio: auto; } .pg .jt-card { width: auto; } }
.dp .jt-card { width: 268px; }
.dp .rc-list .ds { font-size: 19px; }

/* enter, inside, exit: a map and a side panel */
.gf { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 10px; aspect-ratio: 16 / 8.4; }
.gf-map { position: relative; min-width: 0; overflow: hidden; border-radius: 12px; border: 1px solid var(--line); }
.gf-side { min-width: 0; display: flex; flex-direction: column; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper-raised); }
.gf-flow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; }
.gf-node { padding: 6px 9px; border: 1px solid var(--line-hi); border-radius: 8px; background: var(--paper); font: 500 11px/1.2 var(--font-mono); letter-spacing: .04em; color: var(--ink); white-space: nowrap; }
.gf-you { border-color: rgb(var(--accent-rgb) / .55); color: var(--accent-text); }
.gf-track { position: relative; height: 2px; background: repeating-linear-gradient(90deg, var(--line-hi) 0 5px, transparent 5px 9px); }

<script>
/* The Black River, two maps side by side: the same riders ranked in a straight line (left) and by road (right). */
(function () {
  'use strict';
  var M = window.CapeMap, R = new window.Roads(window.CT_MAP), deg = Math.PI / 180;
  var P = R.snap(6955, 3940, 0);
  var A = R.snap(7650, 4170, -25 * deg);   /* Black River Parkway, northbound, on the far bank */
  var B = R.snap(5925, 3250, 107 * deg);   /* Albert Road, eastbound, same side */
  var rA = R.drive(A, P), rB = R.drive(B, P), pA = FK.path(rA.pts), pB = FK.path(rB.pts);
  /* the bridge: where Rider A's route crosses the river, the most northerly part of its trip */
  var bridge = (function () { var L = pA.L, best = null; for (var d = 0; d <= L.len; d += 5) { var q = L.at(d), e = Math.hypot(q.x - 7228, q.y - 3250); if (!best || e < best[2]) best = [q.x, q.y, e]; } return best; })();
  var BOX = { wide: [5820, 3080, 7820, 4330], narrow: [5860, 3100, 7800, 4250], water: window.CT_WATER.polys };
  var sA = Math.hypot(A.x - P.x, A.y - P.y), sB = Math.hypot(B.x - P.x, B.y - P.y);

  function panel(id, road) {
    var box = document.getElementById(id), canvas = box.querySelector('canvas'), map = FK.map(canvas, BOX), grow = FK.motionOn() ? 0 : 1;
    function S(p) { return map.S(p.x != null ? p.x : p[0], p.y != null ? p.y : p[1]); }

      var C = M.cols(), n = FK.narrow(), now = performance.now() / 1000, pp = S(P), a = S(A), b = S(B), clamp = [6, 6, m.w - 6, m.h - 22];
      var rv = map.S(7318, 3790);
      ctx.font = 'italic 400 ' + (n ? 12 : 13) + 'px Fraunces, Georgia, serif'; ctx.fillStyle = C.muted; ctx.textAlign = 'right';
      ctx.fillText('Black River', rv[0], rv[1]);
      if (!road) {
        [[a, false], [b, true]].forEach(function (v) {
          var q = v[0], ex = q[0] + (pp[0] - q[0]) * grow, ey = q[1] + (pp[1] - q[1]) * grow;
          ctx.save(); ctx.setLineDash([5, 5]); ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.strokeStyle = FK.rgba(v[1] ? C.accRGB : C.inkRGB, v[1] ? .9 : .7);

        });

      FK.dot(ctx, a[0], a[1], { b: A.b, pulse: now * .55 + .4 });
      FK.dot(ctx, b[0], b[1], { b: B.b, hot: true, pulse: now * .55 });

      FK.tag(ctx, a, n ? [-40, 34] : [-50, 40], 'Rider A', null, { clamp: clamp });
      FK.tag(ctx, b, n ? [30, 40] : [24, 46], 'Rider B', null, { hot: true, clamp: clamp });
    } });

    if (FK.motionOn()) FK.onView(canvas, function () { FK.tween(road ? 2400 : 800, function (k) { grow = road ? k : FK.ease(k); map.redraw(); }); });
  }

})();
