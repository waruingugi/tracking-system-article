/* The design tokens. Paste this :root block at the top of every page's <style>.
   Light is the default. Every page also ships the night theme: the two blocks at the end.
   Fonts: one Google Fonts link (see components/README.md). */
:root {
  /* paper and ink */
  --paper: #eff2f1;        /* page background */
  --paper-raised: #f8faf9; /* cards and panels */
  --paper-sunk: #e5e9e8;   /* wells, hover fills, the columns note pane */
  --canvas: #f1f3f2;       /* behind dot-grid diagrams */
  --ink: #15181b;
  --ink-rgb: 21 24 27;
  --ink-soft: #363c41;
  --muted: #5b6368;
  --dim: #8e969a;
  --line: rgba(20, 23, 26, .12);
  --line-hi: rgba(20, 23, 26, .26);

  /* the one accent */
  --accent: #e14a0e;       /* big text, marks, the one focal thing */
  --accent-text: #b33a0a;  /* small orange text: links, eyebrow numbers, labels */
  --accent-rgb: 225 74 14;
  --accent-soft: rgba(225, 74, 14, .08);

  /* what each colour means, the same everywhere */
  --sys-frontend: #0891b2;
  --sys-backend: #047857;
  --sys-database: #6d28d9;
  --sys-security: #be123c;
  --sys-bus: #b45309;
  --sys-external: #475569;

  /* the dark plate: code, terminals and the end card only */
  --plate: #0f1216;
  --plate-raised: #161a1f;
  --plate-line: rgba(255, 255, 255, .12);
  --plate-text: #dfe5ea;
  --plate-dim: #79848d;
  --syn-k: #ff9b6b; --syn-s: #a8dcb6; --syn-f: #f2d58c; --syn-t: #8fc8ff;
  --syn-n: #e9b0ff; --syn-c: #6c7882; --syn-p: #c9d3db;
  --diff-add: #3fb950; --diff-del: #f85149; --diff-mod: #d29922; --diff-ren: #58a6ff;

  /* type */
  --font-display: 'Fraunces', Georgia, serif;
  --font-grot: 'Space Grotesk', 'Inter', -apple-system, sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --font-num: 'Antonio', 'Arial Narrow', sans-serif;

  /* shape and motion */
  --radius: 14px;
  --shadow-sm: 0 1px 0 rgba(20, 23, 26, .03), 0 1px 3px rgba(20, 23, 26, .06);
  --shadow-lg: 0 1px 0 rgba(20, 23, 26, .03), 0 30px 60px -30px rgba(20, 23, 26, .28);
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --ease-in-out: cubic-bezier(.65, 0, .35, 1);

  /* Hairline figures take their colours from the page */
  --hairline-plate: var(--paper-raised);
  --hairline-hi: var(--accent);
  --hairline-edge: var(--ink);
  --hairline-mid: var(--muted);
  --hairline-lo: rgba(21, 24, 27, .2);
  --hairline-stroke: .9;

  color-scheme: light;
}
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 17px/1.65 var(--font-body); -webkit-font-smoothing: antialiased; }
::selection { background: rgb(var(--accent-rgb) / .2); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

/* Night theme. Every page ships it. Same jobs, darker paper, brighter orange.
   Two blocks with the same values, kept in step:
   1. the reader's system is dark and they have not picked light;
   2. the reader picked dark (data-theme="dark"), whatever the system says. */
@media (prefers-color-scheme: dark) {
  html:not([data-theme="light"]) {
    --paper: #0d1013;
    --paper-raised: #14181c;
    --paper-sunk: #090b0d;
    --canvas: #101317;
    --ink: #ebeff1;
    --ink-rgb: 235 239 241;
    --ink-soft: #c3cbd1;
    --muted: #8f999f;
    --dim: #5f686e;
    --line: rgb(255 255 255 / .09);
    --line-hi: rgb(255 255 255 / .2);
    --shadow-sm: 0 1px 0 rgb(255 255 255 / .03) inset, 0 1px 3px rgb(0 0 0 / .4);
    --shadow-lg: 0 1px 0 rgb(255 255 255 / .04) inset, 0 30px 60px -30px rgb(0 0 0 / .8);
    --accent: #ff6a2b;
    --accent-text: #ff8d5e;
    --accent-rgb: 255 106 43;
    --plate: #07090b;
    --plate-raised: #0e1114;
    --sys-frontend: #22b8d8;
    --sys-backend: #2bb98a;
    --sys-database: #9f7aea;
    --sys-security: #f0577a;
    --sys-bus: #e8923a;
    --sys-external: #8a98ab;
    --hairline-lo: rgba(235, 239, 241, .2);
    color-scheme: dark;
  }
}

}

/* ---- plain figures: a drawing, a read-out row, a caption line ---- */
html, body { margin: 0; background: var(--paper); }
body { font: 400 15px/1.5 var(--font-body); color: var(--ink); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
.pf { display: flex; flex-direction: column; }
.pf-stage { position: relative; }
.pf-stage svg { display: block; width: 100%; height: auto; overflow: visible; }
.pf-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 14px; padding: 12px 18px 16px; }
.pf-ro { display: flex; flex-wrap: wrap; gap: 8px; }
.pf-st { min-width: 0; padding: 7px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper-raised); }
.pf-st p { margin: 0; font: 500 10px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pf-st b { display: block; margin-top: 3px; font: 400 21px/1.1 var(--font-num); font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
.pf-st.hot b { color: var(--accent); }
.pf-say { flex: 1 1 260px; margin: 0; min-height: 2.9em; font-size: 14px; line-height: 1.45; color: var(--ink-soft); transition: opacity .16s var(--ease-out); }
.pf-say.out { opacity: 0; }
.pf-btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--line-hi); border-radius: 9px; background: var(--paper-raised); font: 500 13px/1 var(--font-body); color: var(--ink); cursor: pointer; transition: transform .15s var(--ease-out), background-color .15s; }
.pf-btn:hover { background: var(--paper-sunk); }
.pf-btn:active { transform: scale(.97); }
.pf-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pf-btn svg { width: 14px; height: 14px; }
/* Replay buttons are orange, so people see they can press them. */
.pf-btn[id$="Replay"], .pf-btn[id$="Re"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--paper-raised)); color: var(--accent-text); }
.pf-btn[id$="Replay"]:hover, .pf-btn[id$="Re"]:hover { background: color-mix(in srgb, var(--accent) 22%, var(--paper-raised)); }
@media (pointer: coarse) { .pf-btn { height: 40px; } }
/* svg text */
.t-lab { font: 500 13px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; fill: var(--ink); }

.s-paper { fill: var(--paper-raised); }

<body class="kit">
<!--meta aspect 1030/470 -->
<!--meta title The login, checked once -->
<div class="pf" id="lg">
  <div class="pf-stage"><svg id="lgSvg" role="img" aria-label="A rider's phone connects to a gate. The gate asks the database once whether the phone is allowed in. The answer is yes, so the gate opens for that phone's own channel. After that, every ping flows through the open gate into the log, and the database is not asked again."></svg></div>
  <div class="pf-bar">
    <p class="pf-say" id="lgSay" aria-live="polite">The rider's phone connects with its own username and password.</p>
    <div class="pf-ro">
      <div class="pf-st hot"><p>Database checks</p><b id="lgChecks">0</b></div>
      <div class="pf-st"><p>Pings let through</p><b id="lgPings">0</b></div>
      <button class="pf-btn" type="button" id="lgReplay"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 8a5.5 5.5 0 1 0 1.7-4"/><path d="M2.5 2.5v3h3"/></svg>Replay</button>
    </div>
  </div>
</div>

<script>
/* Shared helpers for the plain figures. */
(function () {
  'use strict';
  var root = document.documentElement, NS = 'http://www.w3.org/2000/svg', P = {};
  P.motionOn = function () { return root.dataset.motion !== 'off'; };
  P.narrow = function () { return window.innerWidth < 600; };
  P.el = function (parent, tag, a, text) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); if (text != null) e.textContent = text; if (parent) parent.appendChild(e); return e; };
  P.ease = function (t) { return 1 - Math.pow(1 - t, 3); };
  P.easeIO = function (t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  P.clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  /* a clock that reads performance.now() itself: a rAF timestamp can sit on another timeline inside an iframe */
  P.clock = function (fn) {
    var on = true, t0 = performance.now();
    (function f() { if (!on) return; var t = (performance.now() - t0) / 1000; if (fn(t) !== false) requestAnimationFrame(f); else on = false; })();
    return { stop: function () { on = false; } };
  };
  /* Play again after a short pause, so people who missed the start see it. Waits while the figure is off screen. */
  P.again = function (el, play, ms) {
    var vis = true, pend = false, t = 0;
    if ('IntersectionObserver' in window) new IntersectionObserver(function (es) { vis = es[0].isIntersecting; if (vis && pend) { pend = false; play(); } }).observe(el);
    return {
      done: function () { clearTimeout(t); t = setTimeout(function () { if (!P.motionOn()) return; if (vis) play(); else pend = true; }, ms || 3000); },
      cancel: function () { clearTimeout(t); pend = false; }
    };
  };
  P.onView = function (el, fn) {
    if (!('IntersectionObserver' in window)) { fn(); return; }
    var io = new IntersectionObserver(function (es) { if (es[0].isIntersecting) { io.disconnect(); fn(); } }, { threshold: .35 }); io.observe(el);
  };
  P.say = function (node, text) {
    if (!node || node.textContent === text) return;
    if (!P.motionOn()) { node.textContent = text; return; }
    node.classList.add('out'); setTimeout(function () { node.textContent = text; node.classList.remove('out'); }, 170);
  };
  P.bump = function (node, v) {
    v = String(v); if (node.textContent === v) return; node.textContent = v;
    if (P.motionOn()) node.animate([{ transform: 'translateY(-3px)', opacity: .4 }, { transform: 'none', opacity: 1 }], { duration: 240, easing: 'cubic-bezier(.22,1,.36,1)' });
  };
  /* redraw on width class change */
  P.onLayout = function (fn) { var n = P.narrow(); addEventListener('resize', function () { if (P.narrow() !== n) { n = P.narrow(); fn(); } }); };
  window.PF = P;
})();

</script>
<script>
/* The login, checked once: a phone, a boom gate that asks the database once, then pings flow through to the log. */
(function () {
  'use strict';
  var svg = document.getElementById('lgSvg'), el = PF.el;
  var sayEl = document.getElementById('lgSay'), cEl = document.getElementById('lgChecks'), pEl = document.getElementById('lgPings');
  /* two layouts: a row on wide screens, a column on phones */
  var LAY = {
    wide: { vb: [0, 50, 1000, 330], phone: [120, 150], gate: [470, 150], db: [470, 296], log: [640, 150, 920], boomClosed: 0, boomOpen: 88, pivot: [470, 208], boomLen: 112, path: [[160, 150], [940, 150]] },
    narrow: { vb: [0, 0, 400, 600], phone: [200, 92], gate: [200, 290], db: [330, 290], log: [200, 440, 560], boomClosed: -90, boomOpen: -2, pivot: [130, 290], boomLen: 120, vertical: true, path: [[200, 140], [200, 570]] }
  };
  var L, parts = {}, run = null;
  var SAY = [
    [0, "The rider's phone connects with its own username and password."],
    [1.1, 'The gate asks the database once: is this phone allowed in?'],
    [2.3, "Yes. The gate opens, but only for this phone's own channel."],
    [3.4, 'Now every ping flows straight through. The database is not asked again.']
  ];

  function draw() {
    L = PF.narrow() ? LAY.narrow : LAY.wide;
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.setAttribute('viewBox', L.vb.join(' '));
    var g = el(svg, 'g', {});
    /* the road the pings take */
    el(g, 'line', { class: 's-dash', x1: L.path[0][0], y1: L.path[0][1], x2: L.path[1][0], y2: L.path[1][1] });
    /* the database, with its question line to the gate */
    var d = L.db, q = el(g, 'line', { class: 's-dash', x1: L.gate[0], y1: L.gate[1], x2: d[0], y2: d[1] - 22 });
    if (L.vertical) { q.setAttribute('x1', L.gate[0] + 24); q.setAttribute('y1', L.gate[1]); q.setAttribute('x2', d[0] - 36); q.setAttribute('y2', d[1]); }
    var dbg = el(g, 'g', { transform: 'translate(' + d[0] + ',' + d[1] + ')' });
    var dbBody = el(dbg, 'path', { class: 's-card', d: 'M-34 -16 v34 a34 9 0 0 0 68 0 v-34' });
    el(dbg, 'path', { class: 's-line', d: 'M-34 1 a34 9 0 0 0 68 0' });
    var dbTop = el(dbg, 'ellipse', { class: 's-card', cx: 0, cy: -16, rx: 34, ry: 9 });
    var dbLab = el(g, 'text', { class: 't-lab', x: d[0], y: d[1] + (L.vertical ? 52 : 50), 'text-anchor': 'middle' }, 'Database');
    var dbSub = el(g, 'text', { class: 't-sub', x: d[0], y: d[1] + (L.vertical ? 72 : 70), 'text-anchor': 'middle' }, 'who may log in');
    /* the phone: a black case and a white screen in both themes, grey speaker and home bar */
    var p = L.phone, ph = el(g, 'g', { transform: 'translate(' + p[0] + ',' + p[1] + ')' });
    el(ph, 'rect', { x: -34, y: -60, width: 68, height: 120, rx: 13, fill: '#0f1216', stroke: 'var(--line-hi)' });
    el(ph, 'rect', { x: -29, y: -54, width: 58, height: 108, rx: 9, fill: '#ffffff' });
    el(ph, 'rect', { x: -9, y: -50, width: 18, height: 5, rx: 2.5, fill: '#8e969a' });
    el(ph, 'rect', { x: -12, y: 46, width: 24, height: 3, rx: 1.5, fill: '#8e969a' });
    var ring = el(ph, 'circle', { cx: 0, cy: 0, r: 8, fill: 'none', stroke: 'var(--accent)', 'stroke-width': 1.5, opacity: 0 });
    el(ph, 'circle', { cx: 0, cy: 0, r: 6, class: 's-acc' });
    el(g, 'text', { class: 't-lab', x: p[0] + (L.vertical ? 70 : 0), y: p[1] + (L.vertical ? -6 : 88), 'text-anchor': L.vertical ? 'start' : 'middle' }, "Rider's phone");
    el(g, 'text', { class: 't-sub', x: p[0] + (L.vertical ? 70 : 0), y: p[1] + (L.vertical ? 14 : 108), 'text-anchor': L.vertical ? 'start' : 'middle' }, 'starts a shift');
    /* the log: a tape that fills with pings */
    var lg = L.log, logG = el(g, 'g', {}), cells = [];
    if (!L.vertical) {
      el(logG, 'rect', { class: 's-card', x: lg[0], y: lg[1] - 24, width: lg[2] - lg[0], height: 48, rx: 8 });
      for (var i = 0; i < 12; i++) cells.push(el(logG, 'rect', { x: lg[0] + 10 + i * 22.5, y: lg[1] - 12, width: 16, height: 24, rx: 3, fill: 'var(--paper-sunk)' }));
      el(g, 'text', { class: 't-lab', x: (lg[0] + lg[2]) / 2, y: lg[1] + 56, 'text-anchor': 'middle' }, 'The log');
      el(g, 'text', { class: 't-sub', x: (lg[0] + lg[2]) / 2, y: lg[1] + 76, 'text-anchor': 'middle' }, 'every ping lands here');
    } else {
      el(logG, 'rect', { class: 's-card', x: lg[0] - 24, y: lg[1], width: 48, height: lg[2] - lg[1], rx: 8 });
      for (var j = 0; j < 4; j++) cells.push(el(logG, 'rect', { x: lg[0] - 12, y: lg[1] + 10 + j * 27, width: 24, height: 20, rx: 3, fill: 'var(--paper-sunk)' }));
      el(g, 'text', { class: 't-lab', x: lg[0] + 40, y: lg[1] + 46 }, 'The log');
      el(g, 'text', { class: 't-sub', x: lg[0] + 40, y: lg[1] + 66 }, 'every ping lands here');
    }
    /* the gate: a post and a striped boom that swings open */
    var gt = L.gate, pv = L.pivot;
    var boom = el(g, 'g', { transform: 'translate(' + pv[0] + ',' + pv[1] + ') rotate(' + L.boomClosed + ')' });
    var len = L.boomLen;
    el(boom, 'rect', { x: -5, y: -len, width: 10, height: len, rx: 5, class: 's-paper', stroke: 'var(--accent)', 'stroke-width': 1.5 });
    for (var s = 0; s < 4; s++) el(boom, 'rect', { x: -4.2, y: -len + 8 + s * 26, width: 8.4, height: 12, fill: 'var(--accent)' });
    el(g, 'rect', { x: pv[0] - 9, y: pv[1] - 9, width: 18, height: 26, rx: 4, class: 's-ink' });
    el(g, 'circle', { cx: pv[0], cy: pv[1], r: 4, fill: 'var(--paper-raised)' });
    var gLabX = L.vertical ? 16 : gt[0], gLabY = L.vertical ? gt[1] + 52 : gt[1] - 62;
    var anc = L.vertical ? 'start' : 'middle';
    el(g, 'text', { class: 't-lab', x: gLabX, y: gLabY, 'text-anchor': anc }, 'Login check');
    var gSub = el(g, 'text', { class: 't-sub', x: gLabX, y: gLabY + 20, 'text-anchor': anc }, 'gate closed');
    var ok = el(g, 'g', { transform: 'translate(' + (L.vertical ? gt[0] + 40 : gt[0] - 98) + ',' + (L.vertical ? gt[1] - 34 : gt[1] - 68) + ')', opacity: 0 });
    el(ok, 'circle', { r: 13, class: 's-acc' });
    el(ok, 'path', { d: 'M-5.5 0.5 l3.6 3.6 l7.4 -7.6', fill: 'none', stroke: '#fff', 'stroke-width': 2.4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    var fly = el(g, 'g', {});
    parts = { boom: boom, pv: pv, ring: ring, dbBody: dbBody, dbTop: dbTop, dbSub: dbSub, gSub: gSub, ok: ok, fly: fly, cells: cells, q: q };
  }

  function lerp(a, b, k) { return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]; }
  function along(k) { return lerp(L.path[0], L.path[1], k); }
  /* where the gate and the log sit along the road, as a share of it */
  function shareOf(pt) { var a = L.path[0], b = L.path[1], dx = b[0] - a[0], dy = b[1] - a[1]; return ((pt[0] - a[0]) * dx + (pt[1] - a[1]) * dy) / (dx * dx + dy * dy); }

  function frame(t) {
    var P = parts, gk = shareOf(L.gate), lk = shareOf(L.vertical ? [L.log[0], L.log[1] + 20] : [L.log[0] + 20, L.log[1]]);
    while (P.fly.firstChild) P.fly.removeChild(P.fly.firstChild);
    P.ring.setAttribute('opacity', 0);
    /* 1. the login card goes to the gate */
    if (t < 1.1) { var c = along(PF.easeIO(t / 1.1) * (gk - .04)); var kg = el(P.fly, 'g', { transform: 'translate(' + c[0] + ',' + c[1] + ')' }); el(kg, 'rect', { x: -26, y: -11, width: 52, height: 22, rx: 6, class: 's-acc' }); el(kg, 'text', { x: 0, y: 4.5, 'text-anchor': 'middle', fill: '#fff', style: 'font:500 11px var(--font-mono);letter-spacing:.06em' }, 'LOGIN'); }
    /* 2. the one question to the database and back */
    var checks = t >= 1.7 ? 1 : 0;
    if (t >= 1.1 && t < 2.3) {
      var u = t < 1.7 ? (t - 1.1) / .6 : 1 - (t - 1.7) / .6, a = [+P.q.getAttribute('x1'), +P.q.getAttribute('y1')], b = [+P.q.getAttribute('x2'), +P.q.getAttribute('y2')], m = lerp(a, b, PF.easeIO(u));
      el(P.fly, 'circle', { cx: m[0], cy: m[1], r: 6, class: 's-acc' });
    }
    var asked = t >= 1.6 && t < 2.4;
    P.dbTop.style.stroke = P.dbBody.style.stroke = asked ? 'var(--accent)' : '';
    P.dbSub.textContent = t < 1.7 ? 'who may log in' : t < 3.4 ? 'checked once: allowed' : 'not asked again';
    P.dbSub.setAttribute('class', 't-sub' + (t >= 3.4 ? '' : t >= 1.7 ? ' t-hot' : ''));
    /* 3. allowed: the tick pops, the boom swings open */
    P.ok.setAttribute('opacity', t < 2.3 ? 0 : Math.min(1, (t - 2.3) * 4));
    var open = PF.clamp((t - 2.5) / .7, 0, 1), ang = L.boomClosed + (L.boomOpen - L.boomClosed) * PF.easeIO(open);
    P.boom.setAttribute('transform', 'translate(' + P.pv[0] + ',' + P.pv[1] + ') rotate(' + ang + ')');
    P.gSub.textContent = open >= 1 ? 'open for this phone' : t >= 1.1 ? 'asking…' : 'gate closed';
    /* 4. pings stream through */
    var through = 0, GAP = .11, TRIP = .9;
    if (t >= 3.3) {
      var n = Math.floor((t - 3.3) / GAP);
      for (var i = 0; i <= n; i++) {
        var age = t - 3.3 - i * GAP;
        if (age >= TRIP) { through++; continue; }
        var pt = along(lk * (age / TRIP));
        el(P.fly, 'circle', { cx: pt[0], cy: pt[1], r: 4.5, class: 's-acc', opacity: .9 });
      }
      if (PF.motionOn() && t < 9.8) { var r = (t * 2) % 1; P.ring.setAttribute('r', 8 + 12 * r); P.ring.setAttribute('opacity', .7 * (1 - r)); }
    }
    /* the tape keeps the newest pings, newest at the far end */
    P.cells.forEach(function (cell, k) { var filled = k < Math.min(P.cells.length, through); cell.setAttribute('fill', filled ? (k === Math.min(P.cells.length, through) - 1 ? 'var(--accent)' : 'var(--ink-soft)') : 'var(--paper-sunk)'); cell.setAttribute('opacity', filled ? (k === Math.min(P.cells.length, through) - 1 ? 1 : .55) : 1); });
    PF.bump(cEl, checks); PF.bump(pEl, through.toLocaleString('en-US'));
    var line = SAY[0][1]; SAY.forEach(function (s) { if (t >= s[0]) line = s[1]; }); PF.say(sayEl, line);
  }

  var END = 10;
  function play() { lp.cancel(); if (run) run.stop(); run = PF.clock(function (t) { frame(Math.min(t, END)); if (t >= END) lp.done(); return t < END; }); }
  var lp = PF.again(svg, play);
  function still() { frame(END); }
  draw();
  document.getElementById('lgReplay').addEventListener('click', function () { PF.motionOn() ? play() : still(); });
  PF.onLayout(function () { draw(); still(); });
  if (PF.motionOn()) { frame(0); PF.onView(svg, play); } else still();
})();

</script>
