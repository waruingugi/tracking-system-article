<script>

function onView(el,fn){if(!('IntersectionObserver' in window)){fn();return}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&e.intersectionRatio>=.35){io.disconnect();fn()}})},{threshold:[0,.35,.6]});io.observe(el)}
function tween(dur,step,done){var t0=null;function f(ts){if(t0===null)t0=ts;var k=Math.min(1,(ts-t0)/dur);step(k);if(k<1)requestAnimationFrame(f);else if(done)done()}requestAnimationFrame(f)}
function easeIO(k){return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2}

document.querySelectorAll('svg.dg').forEach(function(s){var k=0;s.querySelectorAll('[data-dg],.dg-c').forEach(function(e){e.style.setProperty('--i',k++%14)});
  if(!MOTION()){s.classList.add('in');return}onView(s.parentNode,function(){s.classList.add('in')})});

function lenOf(pts){var L=0;for(var i=1;i<pts.length;i++)L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);return L}
function at(pts,d){for(var i=1;i<pts.length;i++){var a=pts[i-1],b=pts[i],l=Math.hypot(b[0]-a[0],b[1]-a[1]);if(d<=l||i===pts.length-1){var k=l?Math.min(1,d/l):1;return[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k]}d-=l}return pts[pts.length-1]}
function travel(layer,pts,cls,speed,done){var L=lenOf(pts),r=mk(layer,'circle',{r:6,'class':'tk-r'}),c=mk(layer,'circle',{r:5.5,'class':'tk '+(cls||'')});
  if(cls)r.style.stroke='var(--ink)';
  tween(Math.max(450,L/(speed||240)*1000),function(k){var p=at(pts,L*easeIO(k));c.setAttribute('cx',p[0]);c.setAttribute('cy',p[1]);r.setAttribute('cx',p[0]);r.setAttribute('cy',p[1]);r.setAttribute('r',6+6*((k*2.5)%1));r.style.opacity=1-((k*2.5)%1)},function(){done&&done(c,r)});return c}
function flash(layer,b){var h=mk(layer,'rect',{x:b[0]-4,y:b[1]-4,width:b[2]+8,height:b[3]+8,rx:11,'class':'flash'});tween(900,function(k){h.style.opacity=1-k},function(){h.remove()})}
function wait(ms){return function(next){setTimeout(next,ms)}}
function chain(list,my,get){var i=0;(function step(){if(my!==get())return;if(i>=list.length)return;var f=list[i++];f(step)})()}
var cfg={"end": "Small, exact things live in Postgres. The flood of pings lives in the log and in ClickHouse."};
var cap=document.querySelector('.fcap'),btn=document.querySelector('.fbtn.play'),run=0,layer=null;
var G={w:{p:[[400,100],[790,100],[790,400],[820,400]],q:[[975,360],[975,182]],dev:[300,70,200,148],log:[820,360,185,94],pos:[820,60,185,112]},
       n:{p:[[95,236],[180,236],[190,236],[190,640]],q:[[190,698],[190,780]],dev:[12,180,166,94],log:[12,640,356,76],pos:[12,780,356,94]}};
function play(){var my=++run,svg=cur(),g=G[svg.classList.contains('n')?'n':'w'];if(layer)layer.remove();layer=mk(svg,'g',{'aria-hidden':'true'});btn.disabled=true;
  chain([function(n){say(cap,'1','A device sends a ping. Postgres is not touched.');flash(layer,g.dev);setTimeout(n,700)},
    function(n){travel(layer,g.p,'',300,function(c,r){c.remove();r.remove();flash(layer,g.log);n()})},
    function(n){say(cap,'2','The ping lands in the log. It is kept for 24 hours.');setTimeout(n,1300)},
    function(n){say(cap,'3','ClickHouse copies pings in batches. Each row holds only the device id.');travel(layer,g.q,'',160,function(c,r){c.remove();r.remove();flash(layer,g.pos);n()})},wait(1500),
    function(n){say(cap,'',cfg.end);btn.disabled=false;btn.lastChild.textContent=' Play again';n()}],my,function(){return run})}
btn.addEventListener('click',play);
if(MOTION())onView(document.querySelector('.dgwrap'),function(){setTimeout(play,1800)});else say(cap,'',cfg.end);
</script></body></html>
