        <title id="n-archify-diagram-title">The whole system</title>
        <desc id="n-archify-diagram-description">Phones send positions over MQTT to NATS, the log. NATS asks the login service once per connection, and the login service checks Postgres. Three readers copy from the log: the live table in the API servers, Tile38 for zones and alerts, and ClickHouse for history. Your server asks the API where a vehicle is and who is nearest, and the API asks Valhalla for road distance. Tile38&#x27;s crossings go to the webhook sender, which calls your server.</desc>
