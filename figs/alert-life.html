.0" y="81.0" text-anchor="middle">watching one vehicle</text></g><g class="dg-n f" data-dg><rect class="dg-nm" x="170" y="130" width="200" height="56" rx="6" fill="#f1f3f2"/><rect class="dg-nb" x="170" y="130" width="200" height="56" rx="6" fill="#f8faf9" stroke="#15181b" stroke-width="1"/><rect class="dg-tg" x="332" y="137" width="30" height="12" rx="2" fill="none" stroke="#8e969a" stroke-width="0.8"/><text class="dg-tt" x="347.0" y="146" text-anchor="middle">END</text><text class="dg-name" x="270.0" y="156.0" text-anchor="middle">Fired</text><text class="dg-sub" x="270.0" y="171.0" text-anchor="middle">the crossing happened</text></g><g class="dg-n e" data-dg><rect class="dg-nm" x="170" y="220" width="200" height="56" rx="6" fill="#f1f3f2"/><rect class="dg-nb" x="170" y="220" width="200" height="56" rx="6" fill="#f8faf9" stroke="#15181b" stroke-width="1"/><rect class="dg-tg" x="332" y="227" width="30" height="12" rx="2" fill="none" stroke="#8e969a" stroke-width="0.8"/><text class="dg-tt" x="347.0" y="236" text-anchor="middle">END</text><text class="dg-name" x="270.0" y="246.0" text-anchor="middle">Expired</text><text class="dg-sub" x="270.0" y="261.0" text-anchor="middle">24 hours passed</text></g><g class="dg-n e" data-dg><rect class="dg-nm" x="170" y="310" width="200" height="56" rx="6" fill="#f1f3f2"/><rect class="dg-nb" x="170" y="310" width="200" height="56" rx="6" fill="#f8faf9" stroke="#15181b" stroke-width="1"/><rect class="dg-tg" x="332" y="317" width="30" height="12" rx="2" fill="none" stroke="#8e969a" stroke-width="0.8"/><text class="dg-tt" x="347.0" y="326" text-anchor="middle">END</text><text class="dg-name" x="270.0" y="336.0" text-anchor="middle">Ended</text><text class="dg-sub" x="270.0" y="351.0" text-anchor="middle">you cancelled it</text></g><text class="dg-note" x="20" y="400" text-anchor="start">Only one process can win the step to Fired.</text><text class="dg-note" x="20" y="418" text-anchor="start">A second try resends the same event.</text> <script>
var MOTION=function(){return document.documentElement.dataset.motion!=='off'};
function say(el,num,text){var t=el.querySelector('.t'),n=el.querySelector('.n');
  if(!MOTION()){t.textContent=text;n.textContent=num;return}
  t.classList.add('out');setTimeout(function(){t.textContent=text;n.textContent=num;t.classList.remove('out')},170)}
function onView(el,fn){if(!('IntersectionObserver' in window)){fn();return}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&e.intersectionRatio>=.35){io.disconnect();fn()}})},{threshold:[0,.35,.6]});io.observe(el)}
function tween(dur,step,done){var t0=null;function f(ts){if(t0===null)t0=ts;var k=Math.min(1,(ts-t0)/dur);step(k);if(k<1)requestAnimationFrame(f);else if(done)done()}requestAnimationFrame(f)}
function easeIO(k){return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2}

document.documentElement.classList.add(MOTION()?'anim':'still');
document.querySelectorAll('svg.dg').forEach(function(s){var k=0;s.querySelectorAll('[data-dg],.dg-c').forEach(function(e){e.style.setProperty('--i',k++%14)});
  if(!MOTION()){s.classList.add('in');return}onView(s.parentNode,function(){s.classList.add('in')})});
var NS='http://www.w3.org/2000/svg';
function cur(){return matchMedia('(max-width:600px)').matches?document.querySelector('svg.dg.n'):document.querySelector('svg.dg.w')}
function mk(p,tag,a){var e=document.createElementNS(NS,tag);for(var k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}
function lenOf(pts){var L=0;for(var i=1;i<pts.length;i++)L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);return L}
function at(pts,d){for(var i=1;i<pts.length;i++){var a=pts[i-1],b=pts[i],l=Math.hypot(b[0]-a[0],b[1]-a[1]);if(d<=l||i===pts.length-1){var k=l?Math.min(1,d/l):1;return[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k]}d-=l}return pts[pts.length-1]}
function travel(layer,pts,cls,speed,done){var L=lenOf(pts),r=mk(layer,'circle',{r:6,'class':'tk-r'}),c=mk(layer,'circle',{r:5.5,'class':'tk '+(cls||'')});
  if(cls)r.style.stroke='var(--ink)';
  tween(Math.max(450,L/(speed||240)*1000),function(k){var p=at(pts,L*easeIO(k));c.setAttribute('cx',p[0]);c.setAttribute('cy',p[1]);r.setAttribute('cx',p[0]);r.setAttribute('cy',p[1]);r.setAttribute('r',6+6*((k*2.5)%1));r.style.opacity=1-((k*2.5)%1)},function(){done&&done(c,r)});return c}
function flash(layer,b){var h=mk(layer,'rect',{x:b[0]-4,y:b[1]-4,width:b[2]+8,height:b[3]+8,rx:11,'class':'flash'});tween(900,function(k){h.style.opacity=1-k},function(){h.remove()})}
function wait(ms){return function(next){setTimeout(next,ms)}}
function chain(list,my,get){var i=0;(function step(){if(my!==get())return;if(i>=list.length)return;var f=list[i++];f(step)})()}
var cfg={"end": "One crossing, one Fired, one message. Every other alert ends within 24 hours."};
var cap=document.querySelector('.fcap'),btn=document.querySelector('.fbtn.play'),run=0,layer=null;
var G={w:{start:[[56,190],[100,190]],fire:[[100,190],[280,190],[280,174],[370,174],[370,80],[520,80]],active:[100,158,180,64],fired:[520,48,180,64],pop:[560,122,208,22],
          retry:[[190,190],[280,190],[280,174],[370,174],[370,80],[506,80]]},
       n:{start:[[30,68],[60,68]],fire:[[170,96],[90,96],[90,158],[170,158]],active:[60,40,220,56],fired:[170,130,200,56],pop:[150,191,208,22],retry:[[150,96],[90,96],[90,158],[156,158]]}};
function play(){var my=++run,svg=cur(),g=G[svg.classList.contains('n')?'n':'w'];if(layer)layer.remove();layer=mk(svg,'g',{'aria-hidden':'true'});btn.disabled=true;var tok;
  chain([function(n){say(cap,'1','You create an alert. It is Active, watching one vehicle.');tok=travel(layer,g.start,'',160,function(){flash(layer,g.active);n()})},wait(1100),
    function(n){say(cap,'2','The vehicle crosses. Postgres flips Active to Fired, in one step.');tok.remove();layer.querySelector('.tk-r')&&layer.querySelector('.tk-r').remove();travel(layer,g.fire,'',260,function(c,r){r.remove();tween(500,function(k){c.style.opacity=1-k},function(){c.remove()});flash(layer,g.fired);n()})},wait(1200),
    function(n){say(cap,'3','A late retry sees the same crossing. It finds the alert already fired.');travel(layer,g.retry,'ink',260,function(c,r){r.remove();
      var b=g.pop,p=mk(layer,'g',{'class':'pop'});mk(p,'rect',{x:b[0],y:b[1],width:b[2],height:b[3],rx:4});var t=mk(p,'text',{x:b[0]+b[2]/2,y:b[1]+15,'text-anchor':'middle'});t.textContent='ALREADY FIRED · SAME EVENT SENT';
      tween(350,function(k){p.style.opacity=k});tween(500,function(k){c.style.opacity=1-k});n()})},wait(1700),
    function(n){say(cap,'',cfg.end);btn.disabled=false;btn.lastChild.textContent=' Play again';n()}],my,function(){return run})}
btn.addEventListener('click',play);
if(MOTION())onView(document.querySelector('.dgwrap'),function(){setTimeout(play,1500)});else say(cap,'',cfg.end);
</script></body></html>
