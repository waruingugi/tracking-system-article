*{box-sizing:border-box}
html,body{margin:0;background:var(--paper)}
body{color:var(--ink);font:400 14px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border:1px solid var(--line-hi);border-radius:10px;background:var(--paper-raised);font:500 13px/1 var(--font-body);color:var(--ink);cursor:pointer;transition:transform .15s var(--ease-out),background .2s var(--ease-out)}
.btn:hover{background:var(--paper-sunk)} .btn:active{transform:scale(.97)}
.btn-accent{background:var(--accent);color:#fff;border-color:transparent}
.btn-accent:hover{background:var(--accent);filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fig{padding:14px 18px 16px}
.stage{position:relative}
.stage svg{display:block;width:100%;height:auto;overflow:visible}
.bar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-top:6px}
.hint{font:500 11px/1.3 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.ro{display:flex;flex-wrap:wrap;gap:8px}
.ro .st{min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper-raised)}
.ro .st p{margin:0;font:500 10.5px/1.3 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.ro .st b{display:block;margin-top:3px;font:400 20px/1.18 var(--font-num);font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.ro .st b.acc{color:var(--accent-text)}
.ro .st b small{font:500 11px/1 var(--font-body);color:var(--muted);margin-left:4px}
.lbl{font:500 11px/1.25 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;fill:var(--muted)}
.lbl.acc{fill:var(--accent-text)}
.lead-line{fill:none;stroke:var(--dim);stroke-width:.8;vector-effect:non-scaling-stroke}
.lead-line.acc{stroke:var(--accent)}
@media (max-width:560px){.lbl{font-size:17px}}
