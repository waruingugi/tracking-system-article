<script>
var MOTION=function(){return document.documentElement.dataset.motion!=='off'};
function say(el,num,text){var t=el.querySelector('.t'),n=el.querySelector('.n');
  if(!MOTION()){t.textContent=text;n.textContent=num;return}
  t.classList.add('out');setTimeout(function(){t.textContent=text;n.textContent=num;t.classList.remove('out')},170)}

  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&e.intersectionRatio>=.35){io.disconnect();fn()}})},{threshold:[0,.35,.6]});io.observe(el)}

function easeIO(k){return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2}

var cfg={"kind": "arch", "speed": 300, "hold": 1100, "fade": true, "button": "Meet the six", "end": "Six proven tools, each doing one job. The tracking system fits them together.", "steps": [{"e": "to-nats", "to": "nats", "n": "1", "say": "NATS moves every position and keeps it. This is the log."}, {"e": "to-h3", "to": "h3", "n": "2", "say": "H3 cuts the map into hexagons, so \"who is nearby?\" is fast."}, {"e": "to-postgres", "to": "postgres", "n": "3", "say": "Postgres keeps accounts exact: who may log in, and what they own."}, {"e": "to-tile38", "to": "tile38", "n": "4", "say": "Tile38 spots the moment a vehicle enters or leaves a zone."}, {"e": "to-clickhouse", "to": "clickhouse", "n": "5", "say": "ClickHouse stores the trails, so you can replay any day."}, {"e": "to-valhalla", "to": "valhalla", "n": "6", "say": "Valhalla knows the roads, so \"nearest\" means nearest by road."}]};
var cap=document.querySelector('.fcap'),btn=document.querySelector('.fbtn.play'),wrap=document.querySelector('.axw');
var NS='http://www.w3.org/2000/svg';
function cur(){return matchMedia('(max-width:600px)').matches?document.querySelector('svg.ax-n'):document.querySelector('svg.ax-w')}
function mk(svg,tag,a){var e=document.createElementNS(NS,tag);for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e}

function nodeBox(svg,id){var g=svg.querySelector('[data-node-id="'+id+'"]');if(!g)return null;var r=g.querySelector('rect');return r?{x:+r.getAttribute('x'),y:+r.getAttribute('y'),w:+r.getAttribute('width'),h:+r.getAttribute('height')}:null}
var run=0,layer=null;
var under=null;
function clear(svg){[layer,under].forEach(function(l){if(l&&l.parentNode)l.parentNode.removeChild(l)});layer=mk(svg,'g',{'aria-hidden':'true'});

  if(cfg.kind==='seq')svg.querySelectorAll('g[data-edge-key]').forEach(function(g){g.classList.remove('dimmed','shown')})}
function play(){var my=++run,svg=cur();clear(svg);
  if(cfg.kind==='seq')svg.querySelectorAll('g[data-edge-key]').forEach(function(g){g.classList.add('dimmed')});
  var i=0,steps=(svg.classList.contains('ax-n')&&cfg.stepsN)||cfg.steps;btn.disabled=true;
  (function next(){if(my!==run)return;if(i>=steps.length){say(cap,'',cfg.end);btn.disabled=false;btn.lastChild.textContent=' Play again';return}
    var s=steps[i++],p=edge(svg,s);if(!p){next();return}
    if(cfg.fade){[].slice.call(under.childNodes).concat([].slice.call(layer.querySelectorAll('.tr-halo'))).forEach(function(e){var o=+getComputedStyle(e).opacity;tween(400,function(k){e.style.opacity=o*(1-k)},function(){e.remove()})})}
    if(s.say)say(cap,s.n||'',s.say);
    if(cfg.kind==='seq'){var g=p.parentNode;g.classList.remove('dimmed');g.classList.add('shown')}
    var L=p.getTotalLength(),lit=mk(under,'path',{d:p.getAttribute('d'),'class':'tr-lit','stroke-dasharray':L+' '+L,'stroke-dashoffset':L});
    var ring=mk(layer,'circle',{r:6,'class':'tr-ring'}),dot=mk(layer,'circle',{r:5.5,'class':'tr-dot'});
    var dur=Math.max(520,Math.min(1500,L/cfg.speed*1000));
    tween(dur,function(k){var e=easeIO(k),pt=p.getPointAtLength(L*e);dot.setAttribute('cx',pt.x);dot.setAttribute('cy',pt.y);ring.setAttribute('cx',pt.x);ring.setAttribute('cy',pt.y);
      ring.setAttribute('r',6+6*((k*3)%1));ring.style.opacity=1-((k*3)%1);lit.setAttribute('stroke-dashoffset',L*(1-e))},function(){
      if(my!==run)return;layer.removeChild(ring);layer.removeChild(dot);
      var b=s.to&&nodeBox(svg,s.to);
      if(b){var h=mk(layer,'rect',{x:b.x-4,y:b.y-4,width:b.w+8,height:b.h+8,rx:9,'class':'tr-halo'});tween(700,function(k){h.style.opacity=1-k*.55})}
      setTimeout(next,s.hold||cfg.hold)})})()}

if(MOTION())onView(wrap,function(){setTimeout(play,350)});else{say(cap,'',cfg.end)}
