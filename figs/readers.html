/* The design tokens. Paste this :root block at the top of every page's <style>.
   Light is the default. Every page also ships the night theme: the two blocks at the end.
   Fonts: one Google Fonts link (see components/README.md). */
:root {
  /* paper and ink */
  --paper: #eff2f1;        /* page background */
  --paper-raised: #f8faf9; /* cards and panels */
  --paper-sunk: #e5e9e8;   /* wells, hover fills, the columns note pane */
  --canvas: #f1f3f2;       /* behind dot-grid diagrams */
  --ink: #15181b;
  --ink-rgb: 21 24 27;
  --ink-soft: #363c41;
  --muted: #5b6368;
  --dim: #8e969a;
  --line: rgba(20, 23, 26, .12);
  --line-hi: rgba(20, 23, 26, .26);

  /* the one accent */
  --accent: #e14a0e;       /* big text, marks, the one focal thing */
  --accent-text: #b33a0a;  /* small orange text: links, eyebrow numbers, labels */
  --accent-rgb: 225 74 14;
  --accent-soft: rgba(225, 74, 14, .08);

  /* what each colour means, the same everywhere */
  --sys-frontend: #0891b2;
  --sys-backend: #047857;
  --sys-database: #6d28d9;
  --sys-security: #be123c;
  --sys-bus: #b45309;
  --sys-external: #475569;

  /* the dark plate: code, terminals and the end card only */
  --plate: #0f1216;
  --plate-raised: #161a1f;
  --plate-line: rgba(255, 255, 255, .12);
  --plate-text: #dfe5ea;
  --plate-dim: #79848d;
  --syn-k: #ff9b6b; --syn-s: #a8dcb6; --syn-f: #f2d58c; --syn-t: #8fc8ff;
  --syn-n: #e9b0ff; --syn-c: #6c7882; --syn-p: #c9d3db;
  --diff-add: #3fb950; --diff-del: #f85149; --diff-mod: #d29922; --diff-ren: #58a6ff;

  /* type */
  --font-display: 'Fraunces', Georgia, serif;
  --font-grot: 'Space Grotesk', 'Inter', -apple-system, sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --font-num: 'Antonio', 'Arial Narrow', sans-serif;

  /* shape and motion */
  --radius: 14px;
  --shadow-sm: 0 1px 0 rgba(20, 23, 26, .03), 0 1px 3px rgba(20, 23, 26, .06);
  --shadow-lg: 0 1px 0 rgba(20, 23, 26, .03), 0 30px 60px -30px rgba(20, 23, 26, .28);
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --ease-in-out: cubic-bezier(.65, 0, .35, 1);

  /* Hairline figures take their colours from the page */
  --hairline-plate: var(--paper-raised);
  --hairline-hi: var(--accent);
  --hairline-edge: var(--ink);
  --hairline-mid: var(--muted);
  --hairline-lo: rgba(21, 24, 27, .2);
  --hairline-stroke: .9;

  color-scheme: light;
}
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 17px/1.65 var(--font-body); -webkit-font-smoothing: antialiased; }
::selection { background: rgb(var(--accent-rgb) / .2); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

/* Night theme. Every page ships it. Same jobs, darker paper, brighter orange.
   Two blocks with the same values, kept in step:
   1. the reader's system is dark and they have not picked light;
   2. the reader picked dark (data-theme="dark"), whatever the system says. */
@media (prefers-color-scheme: dark) {
  html:not([data-theme="light"]) {
    --paper: #0d1013;
    --paper-raised: #14181c;
    --paper-sunk: #090b0d;
    --canvas: #101317;
    --ink: #ebeff1;
    --ink-rgb: 235 239 241;
    --ink-soft: #c3cbd1;
    --muted: #8f999f;
    --dim: #5f686e;
    --line: rgb(255 255 255 / .09);
    --line-hi: rgb(255 255 255 / .2);
    --shadow-sm: 0 1px 0 rgb(255 255 255 / .03) inset, 0 1px 3px rgb(0 0 0 / .4);
    --shadow-lg: 0 1px 0 rgb(255 255 255 / .04) inset, 0 30px 60px -30px rgb(0 0 0 / .8);
    --accent: #ff6a2b;
    --accent-text: #ff8d5e;
    --accent-rgb: 255 106 43;
    --plate: #07090b;
    --plate-raised: #0e1114;
    --sys-frontend: #22b8d8;
    --sys-backend: #2bb98a;
    --sys-database: #9f7aea;
    --sys-security: #f0577a;
    --sys-bus: #e8923a;
    --sys-external: #8a98ab;
    --hairline-lo: rgba(235, 239, 241, .2);
    color-scheme: dark;
  }
}
html[data-theme="dark"] {

  color-scheme: dark;
}

/* ---- plain figures: a drawing, a read-out row, a caption line ---- */
html, body { margin: 0; background: var(--paper); }
body { font: 400 15px/1.5 var(--font-body); color: var(--ink); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
.pf { display: flex; flex-direction: column; }
.pf-stage { position: relative; }
.pf-stage svg { display: block; width: 100%; height: auto; overflow: visible; }
.pf-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 14px; padding: 12px 18px 16px; }
.pf-ro { display: flex; flex-wrap: wrap; gap: 8px; }
.pf-st { min-width: 0; padding: 7px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper-raised); }
.pf-st p { margin: 0; font: 500 10px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pf-st b { display: block; margin-top: 3px; font: 400 21px/1.1 var(--font-num); font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
.pf-st.hot b { color: var(--accent); }
.pf-say { flex: 1 1 260px; margin: 0; min-height: 2.9em; font-size: 14px; line-height: 1.45; color: var(--ink-soft); transition: opacity .16s var(--ease-out); }
.pf-say.out { opacity: 0; }
.pf-btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--line-hi); border-radius: 9px; background: var(--paper-raised); font: 500 13px/1 var(--font-body); color: var(--ink); cursor: pointer; transition: transform .15s var(--ease-out), background-color .15s; }
.pf-btn:hover { background: var(--paper-sunk); }
.pf-btn:active { transform: scale(.97); }
.pf-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pf-btn svg { width: 14px; height: 14px; }
/* Replay buttons are orange, so people see they can press them. */
.pf-btn[id$="Replay"], .pf-btn[id$="Re"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--paper-raised)); color: var(--accent-text); }
.pf-btn[id$="Replay"]:hover, .pf-btn[id$="Re"]:hover { background: color-mix(in srgb, var(--accent) 22%, var(--paper-raised)); }
@media (pointer: coarse) { .pf-btn { height: 40px; } }
/* svg text */
.t-lab { font: 500 13px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; fill: var(--ink); }

<body class="kit">
<!--meta aspect 1000/400 -->
<!--meta title One log, three readers -->
<div class="pf rdx">
  <div class="pf-stage"><svg id="rdSvg" viewBox="0 0 1000 290" role="img" aria-label="A strip of numbered pings, the log, moves left as phones add new pings on the right. Under it, three readers each mark how far they have read: the live table, Tile38 for alerts, and ClickHouse for history. ClickHouse stops. Its marker stays where it was while the others keep up, and the pings it has not read wait in the log. When ClickHouse comes back it reads the waiting pings quickly and catches up. No ping is lost."></svg></div>
  <div class="pf-bar">
    <p class="pf-say" id="rdSay" aria-live="polite">Phones add each ping to the end of the log. Three readers each keep their own place in it.</p>
    <div class="pf-ro">
      <div class="pf-st"><p>In the log</p><b id="rdIn">0</b></div>
      <div class="pf-st hot"><p>ClickHouse behind</p><b id="rdBehind">0</b></div>
      <div class="pf-st"><p>Pings lost</p><b id="rdLost">0</b></div>
      <button class="pf-btn" type="button" id="rdReplay"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 8a5.5 5.5 0 1 0 1.7-4"/><path d="M2.5 2.5v3h3"/></svg>Replay</button>
    </div>
  </div>
</div>

<script>
/* Shared helpers for the plain figures. */
(function () {
  'use strict';
  var root = document.documentElement, NS = 'http://www.w3.org/2000/svg', P = {};
  P.motionOn = function () { return root.dataset.motion !== 'off'; };
  P.narrow = function () { return window.innerWidth < 600; };
  P.el = function (parent, tag, a, text) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); if (text != null) e.textContent = text; if (parent) parent.appendChild(e); return e; };
  P.ease = function (t) { return 1 - Math.pow(1 - t, 3); };
  P.easeIO = function (t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  P.clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  /* a clock that reads performance.now() itself: a rAF timestamp can sit on another timeline inside an iframe */
  P.clock = function (fn) {
    var on = true, t0 = performance.now();
    (function f() { if (!on) return; var t = (performance.now() - t0) / 1000; if (fn(t) !== false) requestAnimationFrame(f); else on = false; })();
    return { stop: function () { on = false; } };
  };
  /* Play again after a short pause, so people who missed the start see it. Waits while the figure is off screen. */
  P.again = function (el, play, ms) {
    var vis = true, pend = false, t = 0;
    if ('IntersectionObserver' in window) new IntersectionObserver(function (es) { vis = es[0].isIntersecting; if (vis && pend) { pend = false; play(); } }).observe(el);
    return {
      done: function () { clearTimeout(t); t = setTimeout(function () { if (!P.motionOn()) return; if (vis) play(); else pend = true; }, ms || 3000); },
      cancel: function () { clearTimeout(t); pend = false; }
    };
  };
  P.onView = function (el, fn) {
    if (!('IntersectionObserver' in window)) { fn(); return; }
    var io = new IntersectionObserver(function (es) { if (es[0].isIntersecting) { io.disconnect(); fn(); } }, { threshold: .35 }); io.observe(el);
  };
  P.say = function (node, text) {
    if (!node || node.textContent === text) return;
    if (!P.motionOn()) { node.textContent = text; return; }
    node.classList.add('out'); setTimeout(function () { node.textContent = text; node.classList.remove('out'); }, 170);
  };
  P.bump = function (node, v) {
    v = String(v); if (node.textContent === v) return; node.textContent = v;
    if (P.motionOn()) node.animate([{ transform: 'translateY(-3px)', opacity: .4 }, { transform: 'none', opacity: 1 }], { duration: 240, easing: 'cubic-bezier(.22,1,.36,1)' });
  };
  /* redraw on width class change */
  P.onLayout = function (fn) { var n = P.narrow(); addEventListener('resize', function () { if (P.narrow() !== n) { n = P.narrow(); fn(); } }); };
  window.PF = P;
})();

<script>
/* One log, three readers. The log is a strip of numbered pings that moves left as phones add new ones on the right.
   Each reader has its own marker: how far it has read. ClickHouse stops, its marker stays put and the pings it has not
   read wait in the log; it comes back, reads them fast and catches up. Nothing is lost. */
(function () {
  'use strict';
  var el = PF.el, svg = document.getElementById('rdSvg'), say = document.getElementById('rdSay');
  var outIn = document.getElementById('rdIn'), outBehind = document.getElementById('rdBehind');
  var STEP = .6, PRE = 18, BASE = 1200, T_DOWN = 3.6, T_UP = 7.2, RATE = 7, END = 12.5;
  var R = [{ n: 'Live table', sub: 'where is it now?' }, { n: 'Tile38', sub: 'zone alerts' }, { n: 'ClickHouse', sub: 'history' }];
  var G, P = {};

  function sAt(t) { return PRE + t / STEP; }                     /* pings in the log, as a smooth count */
  function batch(t) {                                             /* ClickHouse reads in batches every 2 s */
    var tb = 2 * Math.floor(t / 2), a = Math.floor(sAt(tb)), p = Math.floor(sAt(Math.max(0, tb - 2)));
    if (tb === 0) p = PRE - 3;
    return p + (a - p) * PF.ease(Math.min(1, (t - tb) / .4));
  }
  function readAt(i, t) {
    var s = sAt(t);
    if (i === 0) return s - .4;
    if (i === 1) return s - .9;
    if (t < T_DOWN) return batch(t);
    var frozen = batch(T_DOWN);
    if (t < T_UP) return frozen;
    return Math.min(frozen + RATE * (t - T_UP), Math.floor(s));
  }

  function layout() {
    var n = PF.narrow();
    G = n ? { W: 420, H: 330, L: 14, HX: 372, PX: 400, CW: 34, TY: 40, TH: 34, rows: [138, 212, 286], short: true }
          : { W: 1000, H: 290, L: 170, HX: 860, PX: 935, CW: 46, TY: 40, TH: 36, rows: [134, 192, 250], short: false };
    svg.setAttribute('viewBox', '0 0 ' + G.W + ' ' + G.H);
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var defs = el(svg, 'defs', {}), cp = el(defs, 'clipPath', { id: 'rdClip' });
    el(cp, 'rect', { x: G.L, y: G.TY - 4, width: G.HX - G.L, height: G.TH + 8 });
    el(svg, 'text', { class: 't-lab', x: G.L, y: G.TY - 14, style: 'font-size:11px' }, 'The log · newest on the right');
    P.tape = el(svg, 'g', { 'clip-path': 'url(#rdClip)' });
    el(svg, 'line', { x1: G.HX, y1: G.TY - 6, x2: G.HX, y2: G.TY + G.TH + 6, class: 's-line' });
    /* the phone that adds pings: dark case, white screen */
    var ph = el(svg, 'g', { transform: 'translate(' + G.PX + ',' + (G.TY + G.TH / 2) + ')' });
    el(ph, 'rect', { x: -13, y: -22, width: 26, height: 44, rx: 6, fill: '#0f1216', stroke: 'var(--line-hi)' });
    el(ph, 'rect', { x: -10.5, y: -18.5, width: 21, height: 37, rx: 3.5, fill: '#ffffff' });
    el(ph, 'circle', { cx: 0, cy: 0, r: 3.5, class: 's-acc' });
    if (!G.short) el(svg, 'text', { class: 't-sub', x: G.PX, y: G.TY + G.TH + 26, 'text-anchor': 'middle', style: 'font-size:12px' }, 'phones');
    P.fly = el(svg, 'circle', { r: 4.5, class: 's-acc', opacity: 0 });
    P.rows = R.map(function (r, i) {
      var y = G.rows[i], g = el(svg, 'g', {});
      if (G.short) {
        var t = el(g, 'text', { class: 't-lab', x: G.L, y: y - 14, style: 'font-size:12px' }, r.n);
        el(t, 'tspan', { class: 't-sub', dx: 8, style: 'font-size:13px;text-transform:none;letter-spacing:0' }, r.sub);
      } else {
        el(g, 'text', { class: 't-lab', x: G.L - 22, y: y - 2, 'text-anchor': 'end', style: 'font-size:12px' }, r.n);
        el(g, 'text', { class: 't-sub', x: G.L - 22, y: y + 16, 'text-anchor': 'end', style: 'font-size:13px' }, r.sub);
      }
      el(g, 'line', { x1: G.L, y1: y, x2: G.HX, y2: y, class: 's-line', 'stroke-width': 1 });
      return {
        read: el(g, 'line', { class: 'rd-read', y1: y, y2: y, x1: G.L }),
        gap: el(g, 'line', { class: 'rd-gap', y1: y, y2: y, x2: G.HX }),
        mark: el(g, 'circle', { class: 'rd-mark', cy: y, r: 7 }),
        at: el(g, 'text', { class: 'rd-at', x: G.short ? G.HX : G.HX + 22, y: G.short ? y - 14 : y + 4, 'text-anchor': G.short ? 'end' : 'start' })
      };
    });
  }

  var shown = '', lastIn = -1, lastB = -1;
  function frame(t) {
    var s = sAt(t), have = Math.floor(s), xOf = function (p) { return G.HX - (s - p) * G.CW; };
    var pos = R.map(function (r, i) { return Math.min(readAt(i, t), s); }), ch = pos[2], behind = Math.max(0, have - Math.floor(ch + 1e-6));
    var down = t >= T_DOWN && t < T_UP, waiting = t >= T_DOWN && behind >= 2; /* before the outage, batch reading is normal: no orange */
    /* the tape */
    var tp = P.tape; while (tp.firstChild) tp.removeChild(tp.firstChild);
    for (var i = Math.max(0, Math.floor(s - (G.HX - G.L) / G.CW) - 1); i <= have; i++) {
      var x = xOf(i), w = waiting && i >= Math.floor(ch + 1e-6) && i < have;
      el(tp, 'rect', { x: x + 2, y: G.TY, width: G.CW - 4, height: G.TH, rx: 6, class: 'rd-cell' + (w ? ' wait' : '') });
      el(tp, 'text', { x: x + G.CW / 2, y: G.TY + G.TH / 2 + 4, 'text-anchor': 'middle', class: 'rd-num' + (w ? ' wait' : ''), style: G.short ? 'font-size:10px' : '' }, (G.short ? '' : '#') + (BASE + i));
    }
    /* a ping flies from the phone into the head of the log */
    var f = s - have;
    if (f > .5) { var k = PF.ease((f - .5) / .5); P.fly.setAttribute('cx', G.PX - 14 - (G.PX - 14 - G.HX) * k); P.fly.setAttribute('cy', G.TY + G.TH / 2); P.fly.setAttribute('opacity', 1); }
    else P.fly.setAttribute('opacity', 0);
    /* the three readers */
    P.rows.forEach(function (r, i) {
      var mx = Math.max(G.L, xOf(pos[i])), isDown = i === 2 && down, lag = have - Math.floor(pos[i] + 1e-6);
      r.read.setAttribute('x2', mx); r.mark.setAttribute('cx', mx);
      r.mark.setAttribute('class', 'rd-mark' + (isDown ? ' down' : ''));
      var gap = i === 2 && waiting; r.gap.setAttribute('x1', mx); r.gap.setAttribute('opacity', gap ? 1 : 0);
      var txt = isDown ? 'down · ' + lag + ' waiting' : i === 2 && waiting ? 'catching up · ' + lag : 'read to #' + (BASE + Math.max(0, Math.ceil(pos[i]) - 1));
      if (r.at.textContent !== txt) r.at.textContent = txt;
      r.at.setAttribute('class', 'rd-at' + (i === 2 && waiting ? ' hot' : ''));
    });
    if (have !== lastIn) { lastIn = have; PF.bump(outIn, (BASE + have).toLocaleString('en-US')); }
    if (behind !== lastB) { lastB = behind; PF.bump(outBehind, behind); }
    var line = t < T_DOWN ? 'Phones add each ping to the end of the log. Three readers each keep their own place in it.'
      : t < T_UP ? 'ClickHouse stops. Its marker stays put while the live table and alerts keep reading. Its pings wait in the log.'
      : waiting ? "ClickHouse is back. It reads the waiting pings fast, from where it stopped."
      : 'All caught up. Nothing was lost: the pings waited in the log until ClickHouse was ready.';
    if (line !== shown) { shown = line; PF.say(say, line); }
  }

  var run = null;
  function play() { lp.cancel(); if (run) run.stop(); run = PF.clock(function (t) { frame(Math.min(t, END)); if (t >= END) lp.done(); return t < END; }); }
  var lp = PF.again(svg, play);
  /* with motion off, show the most telling moment: ClickHouse down, its pings waiting */
  function still() { frame(T_UP - .3); }
  layout();
  document.getElementById('rdReplay').addEventListener('click', function () { PF.motionOn() ? play() : still(); });
  PF.onLayout(function () { layout(); if (run) run.stop(); still(); });
  if (PF.motionOn()) { frame(0); PF.onView(svg, play); } else still();
})();

</script>
